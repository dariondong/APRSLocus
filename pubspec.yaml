name: aprslocus
description: "APRSlocus - a local APRS client (no server address bundled)"
publish_to: 'none'
version: 2.1.37+20137

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.1
  gbk_codec: ^0.4.0
  path_provider: ^2.1.4
  path_provider_android: 2.2.15
  flutter_map: ^8.3.1
  vector_map_tiles: ^9.0.0-beta.11
  flutter_svg: ^2.3.0
  # 公告横幅要渲染 Markdown（标题/列表/表格/链接）。只用**解析器**，
  # 渲染由 lib/markdown_view.dart 自己拼 Flutter widget —— 理由见该文件顶部：
  # flutter_markdown 已停止维护，而 markdown_widget 会多带一串依赖；
  # 只加解析器（纯 Dart，依赖仅 args/meta）风险最小，链接也由我们自己交给
  # url_launcher（应用内打开外链的既有做法）。
  markdown: ^7.3.0
  webview_flutter: ^4.14.1
  # 桌面三平台（Windows / macOS / Linux）的系统托盘与窗口控制。
  #
  # 只有桌面用得上：两个插件都直接 import dart:io，所以真实现放在
  # lib/desktop_tray_io.dart，由 lib/desktop_tray.dart 条件导入 —— Web 构建
  # 不会把这两个包编进去（与 lib/exit_app.dart 同一个做法）。
  # Linux 构建机需装 libayatana-appindicator3-dev（只是构建期依赖，
  # 不进 apk / ipa）。
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/aprs_syms/
    - assets/aprs_device/
    - assets/osl.png
    - assets/about_hero.jpg
    - assets/WechatPay.jpg
    - assets/bg2hcb.jpg
    - assets/terms_zh.txt
    - assets/terms_zh_TW.txt
    - assets/terms_en.txt
    # 系统托盘图标：.png 给 macOS（模板图）/ Linux，.ico 给 Windows
    # （Windows 的托盘用 LoadImage(IMAGE_ICON) 读，只认 .ico）。
    - assets/tray_icon.png
    - assets/tray_icon.ico
