            'groupBubble': {'name':'String'}, 'groupInviteFrom': {'from':'String'},
            'groupNameValue': {'name':'String'}, 'groupCallsignValue': {'call':'String'},
            'groupInviteAccepted': {'name':'String'}, 'groupInviteRejected': {'name':'String'},
            'gridValue': {'grid':'String'}, 'packetsPerMinute': {'count':'int'},
            'nextBeaconIn': {'time':'String'}, 'beaconCount': {'count':'int'},
            'beaconSentAprsIs': {'grid':'String'}, 'beaconSentDemo': {'grid':'String'},
            'connectingToServer': {'server':'String','port':'int'},
            'secondsAgo': {'count':'int'}, 'minutesAgo': {'count':'int'},
            'hoursAgo': {'count':'int'}, 'daysAgo': {'count':'int'},
            'copiedCoordsValue': {'coords':'String'}, 'copiedGridValue': {'grid':'String'},
            'distanceBearing': {'distance':'String','bearing':'String'},
            'weatherDataValue': {'data':'String'}, 'trackPoints': {'count':'int'},
            'sendMessageTo': {'call':'String'}, 'stationNoData': {'call':'String'},
            'appInfoText': {'version':'String'}, 'messageTotal': {'count':'int'},
            'broadcastSent': {'count':'int'}, 'groupCallsignLine': {'call':'String'},
            'deleteGroupConfirm': {'name':'String'},
            'memberOnlineCount': {'members':'int','online':'int'},
            'leaveGroupConfirm': {'name':'String'}, 'leftGroup': {'name':'String'},
            'inviteMembersTo': {'name':'String'}, 'inviteSent': {'call':'String'},
            'contactAdded': {'call':'String'}
          }
          for key, placeholders in ph.items():
            zh['@'+key] = {'placeholders': {n:{'type':t} for n,t in placeholders.items()}}

          zh_path.write_text(json.dumps(zh, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          en_path.write_text(json.dumps(en, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          def patch(path, pairs):
            p = root / path
            text = p.read_text(encoding='utf-8')
            for old, new in pairs:
              if old not in text:
                print(f'WARN missing in {path}: {old[:80]!r}')
              text = text.replace(old, new)
            p.write_text(text, encoding='utf-8')

