      - name: Generate localization files
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format translated Dart files
        run: dart format lib/home_page.dart lib/settings_page.dart lib/map_page.dart lib/packets_page.dart lib/station_detail.dart lib/about_page.dart lib/messages_page.dart

      - name: Scan remaining CJK string literals
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re
          pat = re.compile(r"(['\"])(?:(?!\1).)*[\u4e00-\u9fff](?:(?!\1).)*\1")
          for p in sorted(pathlib.Path('lib').glob('*.dart')):
            for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              s=line.strip()
              if s.startswith('//') or s.startswith('///'):
                continue
              if pat.search(line):
                print(f'{p}:{i}: {s}')
          PY

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Commit localization changes and remove helper workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/i18n-complete.yml
          git add lib
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "i18n: localize remaining UI"
          git push origin HEAD:i18n/complete-english
