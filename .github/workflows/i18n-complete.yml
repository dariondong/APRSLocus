name: Complete English localization

on:
  push:
    branches:
      - i18n/complete-english

permissions:
  contents: write

jobs:
  localize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/complete-english
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply localization-only changes
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib

          root = pathlib.Path('.')
          zh_path = root / 'lib/l10n/app_zh.arb'
          en_path = root / 'lib/l10n/app_en.arb'
          zh = json.loads(zh_path.read_text(encoding='utf-8'))
          en = json.loads(en_path.read_text(encoding='utf-8'))

          # appName_desc was accidentally a real message instead of metadata.
          zh.pop('appName_desc', None)
          en.pop('appName_desc', None)
          zh['@appName'] = {'description': '应用名称'}
          en['@appName'] = {'description': 'Application name'}

