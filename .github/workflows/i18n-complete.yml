      - name: Generate and format
        run: |
          flutter pub get
          flutter gen-l10n
          dart format lib/home_page.dart lib/settings_page.dart lib/stations_page.dart lib/station_detail.dart lib/map_page.dart lib/settings_pages.dart lib/oobe_page.dart lib/messages_page.dart lib/log_page.dart lib/splash_page.dart lib/sponsor_page.dart lib/amap_js_map.dart lib/vector_map.dart lib/check_update_page.dart lib/widgets.dart
      - name: Scan remaining CJK string literals
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          pat=re.compile(r"(['\"])(?:(?!\1).)*[\u4e00-\u9fff](?:(?!\1).)*\1")
          for p in sorted(pathlib.Path('lib').glob('*.dart')):
            for i,line in enumerate(p.read_text(encoding='utf-8').splitlines(),1):
              s=line.strip()
              if s.startswith('//') or s.startswith('///'): continue
              if pat.search(line): print(f'{p}:{i}: {s}')
          PY
      - name: Analyze
        continue-on-error: true
        run: flutter analyze
      - name: Commit and remove helper workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/i18n-complete.yml
          git add lib
          git commit -m "i18n: complete settings and auxiliary UI" || exit 0
          git push origin HEAD:i18n/complete-english
