name: Inspect upstream localization merge
on:
  push:
    branches: [i18n/complete-english]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/complete-english
          fetch-depth: 0
      - name: Fetch upstream and inspect merge
        shell: bash
        run: |
          git remote add upstream https://github.com/dariondong/APRSLocus.git
          git fetch upstream main
          set +e
          git merge --no-commit --no-ff upstream/main
          rc=$?
          set -e
          echo "MERGE_RC=$rc"
          echo "=== STATUS ==="
          git status --short
          echo "=== CONFLICT HUNKS ==="
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*.dart'):
              try:
                  lines=p.read_text(encoding='utf-8').splitlines()
              except Exception:
                  continue
              idx=[i for i,x in enumerate(lines) if x.startswith('<<<<<<< ')]
              if not idx: continue
              print(f'--- {p} ---')
              for i in idx:
                  lo=max(0,i-12); hi=min(len(lines),i+80)
                  for n in range(lo,hi): print(f'{n+1:5}: {lines[n]}')
                  print('---')
          PY
          git merge --abort || true
