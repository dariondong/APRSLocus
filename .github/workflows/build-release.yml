name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.5.0），留空则沿用 pubspec'
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver) {
            $ref = "${{ github.ref }}"
            if ($ref -match '^refs/tags/v') { $ver = $ref -replace '^refs/tags/v', '' }
          }
          if ($ver) {
            python tool/sync_version.py $ver
          } else {
            python tool/sync_version.py
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "ISCC=$(Get-Command ISCC.exe | Select-Object -ExpandProperty Source)" | Out-File $env:GITHUB_ENV -Append

      - name: Build Installer
        shell: pwsh
        run: |
          # 版本号跟随 pubspec.yaml（如 1.4.4），传给 Inno 预处理器
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          & "$env:ISCC" "/DMyAppVersion=$ver" installer.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-Windows
          path: output/*.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ref="${{ github.ref }}"
            case "$ref" in refs/tags/v*) ver="${ref#refs/tags/v}";; esac
          fi
          if [ -n "$ver" ]; then
            python tool/sync_version.py "$ver"
          else
            python tool/sync_version.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android signing keys
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 未配置，使用 debug 签名"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=aprslocus\nstoreFile=keystore/release.keystore\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Rename APK
        shell: bash
        run: |
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version: ([0-9.]+).*/\1/')
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/APRSLocus_${ver}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-Android
          path: build/app/outputs/flutter-apk/APRSLocus_*.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ref="${{ github.ref }}"
            case "$ref" in refs/tags/v*) ver="${ref#refs/tags/v}";; esac
          fi
          if [ -n "$ver" ]; then
            python tool/sync_version.py "$ver"
          else
            python tool/sync_version.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (Release, no codesign)
        run: flutter build ios --release --no-codesign

      - name: Upload iOS app
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-iOS
          path: build/ios/iphoneos/*.app

  release:
    name: Publish Release
    needs: [build-windows, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: ls -R

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          # 从 CHANGELOG.md 提取对应版本条目（## [x.y.z] 到下一个 ## 之间）
          body=$(awk -v v="$ver" '
            $0 ~ /^## \[/ {
              if (found) exit
              if ($0 ~ "\\[" v "\\]") found=1
            }
            found { print }
          ' CHANGELOG.md | head -n -1)
          # 用 heredoc 写多行输出（避免 JSON 转义导致乱码）
          {
            echo "notes<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          files: |
            APRSLocus-Windows/*.exe
            APRSLocus-Android/*.apk
            APRSLocus-iOS/*.app

      - name: Sync release to GitCode
        shell: bash
        run: |
          # 未配置 GITCODE_TOKEN 时跳过
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "GITCODE_TOKEN 未配置，跳过 GitCode 同步"
            exit 0
          fi
          tag="${GITHUB_REF#refs/tags/}"
          owner="DarionDong"
          repo="APRSLocus"
          api="https://api.gitcode.com/api/v5/repos/$owner/$repo"
          token="$GITCODE_TOKEN"
          body="${{ steps.notes.outputs.notes }}"

          # 1. 创建 GitCode Release（已存在则忽略错误）
          echo "创建 GitCode Release $tag ..."
          body_esc=$(python3 -c 'import json,sys;print(json.dumps(sys.argv[1]))' "$body")
          curl -sS -X POST "$api/releases?access_token=$token" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$tag\",\"name\":\"$tag\",\"body\":$body_esc}" --max-time 30 >/dev/null || true

          # 2. 上传资产（官方 upload_url 接口，headers 用 Bash 数组避免拼接错误）
          upload_file() {
            local file="$1"
            local filename
            filename=$(basename "$file")
            echo "获取上传地址: $filename ..."
            resp=$(curl -sS "$api/releases/$tag/upload_url?access_token=$token&file_name=$filename" --max-time 30)
            upload_url=$(echo "$resp" | python3 -c 'import json,sys;print(json.load(sys.stdin)["url"])')
            if [ -z "$upload_url" ]; then
              echo "ERROR: GitCode 未返回上传 URL，跳过 $filename"
              return 0
            fi

            # 打印上传 Host（不泄露签名参数）
            upload_host=$(echo "$upload_url" | python3 -c 'from urllib.parse import urlparse;import sys;print(urlparse(sys.stdin.read().strip()).netloc)')
            echo "Upload host: $upload_host"

            # 用 Bash 数组保存 -H 参数（每个 header 独立参数）
            curl_args=()
            while IFS= read -r line; do
              [ -n "$line" ] && curl_args+=(-H "$line")
            done < <(echo "$resp" | python3 -c 'import json,sys;d=json.load(sys.stdin);print("\n".join([k+": "+v for k,v in d.get("headers",{}).items()]))')

            echo "上传: $filename ..."
            # 失败不阻塞：超时/网络问题记录警告继续（GitCode 可稍后手动补传）
            curl --fail-with-body -sS \
              --connect-timeout 20 \
              --max-time 120 \
              -X PUT \
              "${curl_args[@]}" \
              --upload-file "$file" \
              -w '\nHTTP_CODE=%{http_code}\nREMOTE_IP=%{remote_ip}\n' \
              "$upload_url" \
              || echo "警告: $filename 上传失败（网络或签名问题），已跳过"
            echo ""
          }

          for f in APRSLocus-Windows/*.exe APRSLocus-Android/*.apk; do
            [ -f "$f" ] && upload_file "$f"
          done
          echo "GitCode 同步完成（部分失败可手动补传）"
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
