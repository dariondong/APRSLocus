name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.5.0），留空则沿用 pubspec'
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver) {
            $ref = "${{ github.ref }}"
            if ($ref -match '^refs/tags/v') { $ver = $ref -replace '^refs/tags/v', '' }
          }
          if ($ver) {
            python tool/sync_version.py $ver
          } else {
            python tool/sync_version.py
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release --dart-define=QWEATHER_KEY=${{ secrets.QWEATHER_KEY }} --dart-define=QWEATHER_HOST=${{ secrets.QWEATHER_HOST || 'pf4ewvjfqj.re.qweatherapi.com' }}

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "ISCC=$(Get-Command ISCC.exe | Select-Object -ExpandProperty Source)" | Out-File $env:GITHUB_ENV -Append

      - name: Build Installer
        shell: pwsh
        run: |
          # 版本号跟随 pubspec.yaml（如 1.4.4），传给 Inno 预处理器
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          & "$env:ISCC" "/DMyAppVersion=$ver" installer.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-Windows
          path: output/*.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ref="${{ github.ref }}"
            case "$ref" in refs/tags/v*) ver="${ref#refs/tags/v}";; esac
          fi
          if [ -n "$ver" ]; then
            python tool/sync_version.py "$ver"
          else
            python tool/sync_version.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android signing keys
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 未配置，使用 debug 签名"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=aprslocus\nstoreFile=keystore/release.keystore\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Build APK (Release)
        run: flutter build apk --release --dart-define=QWEATHER_KEY=${{ secrets.QWEATHER_KEY }} --dart-define=QWEATHER_HOST=${{ secrets.QWEATHER_HOST || 'pf4ewvjfqj.re.qweatherapi.com' }}

      - name: Rename APK
        shell: bash
        run: |
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version: ([0-9.]+).*/\1/')
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/APRSLocus_${ver}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-Android
          path: build/app/outputs/flutter-apk/APRSLocus_*.apk

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ref="${{ github.ref }}"
            case "$ref" in refs/tags/v*) ver="${ref#refs/tags/v}";; esac
          fi
          if [ -n "$ver" ]; then
            python tool/sync_version.py "$ver"
          else
            python tool/sync_version.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (Release, no codesign)
        run: flutter build ios --release --dart-define=QWEATHER_KEY=${{ secrets.QWEATHER_KEY }} --dart-define=QWEATHER_HOST=${{ secrets.QWEATHER_HOST || 'pf4ewvjfqj.re.qweatherapi.com' }} --no-codesign

      # 把 .app 封成**未签名 .ipa**。为什么非有这一步不可：
      # `.app` 是**目录**，而 action-gh-release 对目录是**静默跳过** ——
      # v1.6.175 / v1.6.176 / v1.6.177 的 Release 页因此一个 iOS 资产都没有
      # （发版流水线却全绿）。而未签名 .ipa 正是 TrollStore / sideloadly / AltStore
      # 这类自签工具的入口：它们拿包之后用**用户自己的**证书重签。
      #
      # 封包交给 tool/make_ipa.py，而不是 `zip` 命令：本机没有 zip 二进制，
      # 写成 Python 才能让本机、CI 检查、发版三处跑**同一份代码**。
      - name: Package IPA (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version: ([0-9.]+).*/\1/')
          ipa="build/ios/ipa/APRSLocus_${ver}_unsigned.ipa"
          python3 tool/make_ipa.py build/ios/iphoneos -o "$ipa"
          # 空文件也算没产出，当场炸；不许把「没产出」混过去
          test -s "$ipa"
          ls -la build/ios/ipa/

      # 两个 artifact **故意分开**，不合并成一个多路径 artifact：
      # upload-artifact 对多个 path 会取公共祖先当根目录，合并后包里会变成
      # `ipa/xxx.ipa` / `iphoneos/Runner.app`，而 Release 那边写的
      # `APRSLocus-iOS/*.ipa` 就**匹配不到** —— 又是一个「流水线全绿、Release 没资产」。
      # 单路径时根目录就是 `build/ios/ipa/`，`*.ipa` 刚好落在包里第一层。
      - name: Upload IPA (安装用)
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-iOS
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload .app (调试用)
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-iOS-app
          path: build/ios/iphoneos/*.app
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: ls -R

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          # 从 CHANGELOG.md 提取该版本的**全部**条目：中文条目 + 紧随其后的英文
          # 条目（两个都是 `## [x.y.z]`），到**下一个版本**的标题为止。
          #
          # 旧写法是「遇到下一个 ## 就停」，于是英文条目被整个丢掉 —— 而更新日志
          # 从 v1.6.78 起就要求中英双语，Release 页却一直只有中文。
          # 判据改成「标题里是不是同一个版本号」，两个条目就都进来了。
          body=$(awk -v v="$ver" '
            $0 ~ /^## \[/ {
              if (found && index($0, "[" v "]") == 0) exit
              if (!found && index($0, "[" v "]") > 0) found=1
            }
            found { print }
          ' CHANGELOG.md | head -n -1)
          # 用 heredoc 写多行输出（避免 JSON 转义导致乱码）
          {
            echo "notes<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          # 只挂 .ipa。**.app 是目录，action-gh-release 会静默跳过** ——
          # v1.6.175~177 的 Release 页因此一个 iOS 资产都没有，而流水线全绿。
          files: |
            APRSLocus-Windows/*.exe
            APRSLocus-Android/*.apk
            APRSLocus-iOS/*.ipa
