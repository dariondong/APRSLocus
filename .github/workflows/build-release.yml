name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.5.0），留空则沿用 pubspec'
        required: false

permissions:
  contents: write

# 同一个 tag 被反复刷新时（改一处 bug 就并回同版号重跑），**取消上一次仍在跑的构建**。
# 否则多次构建并发，Release 会被"先跑完的那次"更新 —— 用户下载到的可能是中间某次
# 的产物，看着就像"这一版没带上修复"（v2.0.20 就踩过这个坑）。
concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync version
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if (-not $ver) {
            $ref = "${{ github.ref }}"
            if ($ref -match '^refs/tags/v') { $ver = $ref -replace '^refs/tags/v', '' }
          }
          if ($ver) {
            python tool/sync_version.py $ver
          } else {
            python tool/sync_version.py
          }

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows (Release)
        run: flutter build windows --release --dart-define=QWEATHER_KEY=${{ secrets.QWEATHER_KEY }} --dart-define=QWEATHER_HOST=${{ secrets.QWEATHER_HOST || 'pf4ewvjfqj.re.qweatherapi.com' }} --dart-define=TIANDITU_KEY=${{ secrets.TIANDITU_KEY }}

      - name: Setup Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "ISCC=$(Get-Command ISCC.exe | Select-Object -ExpandProperty Source)" | Out-File $env:GITHUB_ENV -Append

      - name: Build Installer
        shell: pwsh
        run: |
          # 版本号跟随 pubspec.yaml（如 1.4.4），传给 Inno 预处理器
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version: (\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          & "$env:ISCC" "/DMyAppVersion=$ver" installer.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-Windows
          path: output/*.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Sync version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ref="${{ github.ref }}"
            case "$ref" in refs/tags/v*) ver="${ref#refs/tags/v}";; esac
          fi
          if [ -n "$ver" ]; then
            python tool/sync_version.py "$ver"
          else
            python tool/sync_version.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Setup Android signing keys
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 未配置，使用 debug 签名"
            exit 0
          fi
          mkdir -p android/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.keystore
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=aprslocus\nstoreFile=keystore/release.keystore\n' \
            "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      # 安卓**分架构**打包（v2.0.11 起）：fat APK 里三份原生库（libapp.so 14~17MB +
      # libflutter.so 8~12MB × 3）占了 94%，81.6MB 里 76.6MB 是它们。
      # 改成 --split-per-abi 后每个架构包 ~30MB，三个都挂进 Release。
      #
      # ⚠ **64 位包必须叫 `APRSLocus_<版本>.apk`（不带 ABI 后缀）**：应用内更新取的是
      # 资产列表里第一个 `.apk`，而 GitHub 按**名字升序**返回资产（12 个历史版本逐个
      # 核对过）——`APRSLocus_2.0.11.apk` 里那个 `.`（0x2E）比 `_`（0x5F）小，
      # 所以它永远排在 `APRSLocus_2.0.11_armeabi-v7a.apk` 前面。
      # 这样 64 位用户走的还是原来那条路，**应用内更新逻辑一行都不用改**。
      # 这条不变量由 tool/check_release_assets.py 盯着（改名字/改顺序都会当场报红）。
      - name: Build APK (Release, split per ABI)
        run: flutter build apk --release --split-per-abi --dart-define=QWEATHER_KEY=${{ secrets.QWEATHER_KEY }} --dart-define=QWEATHER_HOST=${{ secrets.QWEATHER_HOST || 'pf4ewvjfqj.re.qweatherapi.com' }} --dart-define=TIANDITU_KEY=${{ secrets.TIANDITU_KEY }}

      - name: Rename APKs (split per ABI)
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version: ([0-9.]+).*/\1/')
          a=build/app/outputs/flutter-apk
          # 先确认三个架构都真的产出了：`--split-per-abi` 的产物名是 Flutter 定的，
          # 万一它改名而这里照旧 mv，就会变成「流水线全绿、Release 少两个包」。
          for abi in arm64-v8a armeabi-v7a x86_64; do
            test -f "$a/app-${abi}-release.apk" \
              || { echo "::error::缺少 $a/app-${abi}-release.apk —— --split-per-abi 没产出这个架构？"; exit 1; }
          done
          # 64 位用**原来的名字**（见上面那段注释：应用内更新按它挑包）；
          # 另外两个各带 ABI 后缀，直接发在 Release 页供手动下载。
          mv "$a/app-arm64-v8a-release.apk"   "$a/APRSLocus_${ver}.apk"
          mv "$a/app-armeabi-v7a-release.apk" "$a/APRSLocus_${ver}_armeabi-v7a.apk"
          mv "$a/app-x86_64-release.apk"      "$a/APRSLocus_${ver}_x86_64.apk"
          ls -la "$a"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-Android
          path: build/app/outputs/flutter-apk/APRSLocus_*.apk
          if-no-files-found: error

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Sync version
        shell: bash
        run: |
          ver="${{ inputs.version }}"
          if [ -z "$ver" ]; then
            ref="${{ github.ref }}"
            case "$ref" in refs/tags/v*) ver="${ref#refs/tags/v}";; esac
          fi
          if [ -n "$ver" ]; then
            python tool/sync_version.py "$ver"
          else
            python tool/sync_version.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (Release, no codesign)
        run: flutter build ios --release --dart-define=QWEATHER_KEY=${{ secrets.QWEATHER_KEY }} --dart-define=QWEATHER_HOST=${{ secrets.QWEATHER_HOST || 'pf4ewvjfqj.re.qweatherapi.com' }} --dart-define=TIANDITU_KEY=${{ secrets.TIANDITU_KEY }} --no-codesign

      # 把 .app 封成**未签名 .ipa**。为什么非有这一步不可：
      # `.app` 是**目录**，而 action-gh-release 对目录是**静默跳过** ——
      # v1.6.175 / v1.6.176 / v1.6.177 的 Release 页因此一个 iOS 资产都没有
      # （发版流水线却全绿）。而未签名 .ipa 正是 TrollStore / sideloadly / AltStore
      # 这类自签工具的入口：它们拿包之后用**用户自己的**证书重签。
      #
      # 封包交给 tool/make_ipa.py，而不是 `zip` 命令：本机没有 zip 二进制，
      # 写成 Python 才能让本机、CI 检查、发版三处跑**同一份代码**。
      - name: Package IPA (unsigned)
        shell: bash
        run: |
          set -euo pipefail
          ver=$(grep -E '^version:' pubspec.yaml | head -1 | sed -E 's/version: ([0-9.]+).*/\1/')
          ipa="build/ios/ipa/APRSLocus_${ver}_unsigned.ipa"
          python3 tool/make_ipa.py build/ios/iphoneos -o "$ipa"
          # 空文件也算没产出，当场炸；不许把「没产出」混过去
          test -s "$ipa"
          ls -la build/ios/ipa/

      # 两个 artifact **故意分开**，不合并成一个多路径 artifact：
      # upload-artifact 对多个 path 会取公共祖先当根目录，合并后包里会变成
      # `ipa/xxx.ipa` / `iphoneos/Runner.app`，而 Release 那边写的
      # `APRSLocus-iOS/*.ipa` 就**匹配不到** —— 又是一个「流水线全绿、Release 没资产」。
      # 单路径时根目录就是 `build/ios/ipa/`，`*.ipa` 刚好落在包里第一层。
      - name: Upload IPA (安装用)
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-iOS
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload .app (调试用)
        uses: actions/upload-artifact@v4
        with:
          name: APRSLocus-iOS-app
          path: build/ios/iphoneos/*.app
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build-windows, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List artifacts
        run: ls -R

      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          ver="${tag#v}"
          # 从 CHANGELOG.md 提取该版本的**全部**条目：中文条目 + 紧随其后的英文
          # 条目（两个都是 `## [x.y.z]`），到**下一个版本**的标题为止。
          #
          # 旧写法是「遇到下一个 ## 就停」，于是英文条目被整个丢掉 —— 而更新日志
          # 从 v1.6.78 起就要求中英双语，Release 页却一直只有中文。
          # 判据改成「标题里是不是同一个版本号」，两个条目就都进来了。
          body=$(awk -v v="$ver" '
            $0 ~ /^## \[/ {
              if (found && index($0, "[" v "]") == 0) exit
              if (!found && index($0, "[" v "]") > 0) found=1
            }
            found { print }
          ' CHANGELOG.md | head -n -1)
          # 用 heredoc 写多行输出（避免 JSON 转义导致乱码）
          {
            echo "notes<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          # 同一个 tag 再跑一次 = **更新**这个 Release（同名资产直接覆盖）。
          # 为什么需要：发出去的版本如果马上发现 bug，把修复并回同一版号重跑即可，
          # 不必为一次打包失误多占一个版本号；没有它，第二次跑会直接失败
          # （"Release already exists"），用户那边则停在旧的包上。
          allow_updates: true
          # 只挂 .ipa。**.app 是目录，action-gh-release 会静默跳过** ——
          # v1.6.175~177 的 Release 页因此一个 iOS 资产都没有，而流水线全绿。
          files: |
            APRSLocus-Windows/*.exe
            APRSLocus-Android/*.apk
            APRSLocus-iOS/*.ipa

  # ─────────────────────────────────────────────────────────────────────────
  # 阿里云 OSS 更新渠道（**可选**）：把安装包 + 一份 GitHub 同格式的 releases
  # 索引传到**公开读**的 OSS bucket，客户端即可从 OSS 走阿里云 CDN 检查 / 下载
  # 更新（见 AppState.updateChannelBases['aliyun'] / ['aliyun_hk']、
  # tool/oss_index.py、tool/check_oss_channel.py）。
  #
  # **两个节点一起发**：广州（`aprslocus`，客户端读默认域名
  # `aprslocus.oss-cn-guangzhou.aliyuncs.com`）与香港（`aprslocushk`，客户端读
  # CNAME 自定义域 `aprslocushk.oss.theez.top`）。两边的索引 key 相同，各自
  # 指向自己域名下的安装包；App 的「Aliyun OSS / Aliyun OSS（香港）」两个渠道
  # 分别对应它们。
  #
  # 凭据一律来自仓库 Secrets（**绝不写明文**，本仓库是公开的）：
  #     OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET（两个 bucket 共用同一套）
  # 未配置时**跳过并告警**（该渠道是可选项，不该让每次发版都变红）——与安卓
  # keystore 的处理一致；一旦配置了却传失败，则**当场失败**。本 job 与官方
  # Release 相互独立，它失败不影响 GitHub / Windows / Android / iOS 发版。
  # 首次启用：① 加上述两个 secret；② 把两个 bucket 读权限都设为公共读。
  # ─────────────────────────────────────────────────────────────────────────
  publish-oss:
    name: Publish to Aliyun OSS
    needs: [build-windows, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      OSS_BUCKET: aprslocus
      OSS_ENDPOINT: oss-cn-guangzhou.aliyuncs.com
      OSS_INDEX_KEY: DarionDong/APRSLocus/releases
      OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
      OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
      # 香港节点（同一条 OSS 通道，香港区域）：客户端走 CNAME 自定义域
      # `aprslocushk.oss.theez.top`（见 AppState.updateChannelBases['aliyun_hk']），
      # 上传用原生 endpoint `oss-cn-hongkong.aliyuncs.com`。索引 key 与广州一致。
      # 复用同一套 OSS_ACCESS_KEY_ID / _SECRET（该 AK 对两个 bucket 都有权限）。
      OSS_HK_BUCKET: aprslocushk
      OSS_HK_ENDPOINT: oss-cn-hongkong.aliyuncs.com
      OSS_HK_DOMAIN: aprslocushk.oss.theez.top
    steps:
      - name: Check OSS credentials
        id: creds
        run: |
          if [ -z "${OSS_ACCESS_KEY_ID:-}" ] || [ -z "${OSS_ACCESS_KEY_SECRET:-}" ]; then
            echo "::warning::未配置 OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET —— 跳过阿里云 OSS 渠道发布（该渠道为可选）。配置：仓库 Settings → Secrets and variables → Actions。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Download build artifacts
        if: steps.creds.outputs.configured == 'true'
        uses: actions/download-artifact@v4

      - name: Install ossutil
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://gosspublic.alicdn.com/ossutil/1.7.19/ossutil-v1.7.19-linux-amd64.zip" -o /tmp/ossutil.zip
          python3 -c "import zipfile;zipfile.ZipFile('/tmp/ossutil.zip').extractall('/tmp/ossutil-bin')"
          OSSUTIL=/tmp/ossutil-bin/ossutil-v1.7.19-linux-amd64/ossutil
          chmod +x "$OSSUTIL"
          echo "OSSUTIL=$OSSUTIL" >> "$GITHUB_ENV"

      - name: Upload installers (public-read)
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ver="${GITHUB_REF#refs/tags/v}"
          prefix="downloads/${ver}"
          # 广州与香港是两个区域、两个 bucket，各用自己的原生 endpoint 上传。
          ossgz() { "$OSSUTIL" "$@" -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"; }
          osshk() { "$OSSUTIL" "$@" -e "$OSS_HK_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"; }
          shopt -s nullglob
          files=(APRSLocus-Windows/*.exe APRSLocus-Android/*.apk APRSLocus-iOS/*.ipa)
          test "${#files[@]}" -gt 0 || { echo "::error::没有可上传的安装包产物"; exit 1; }
          for f in "${files[@]}"; do
            # 目标对象名由 tool/oss_index.py 的同一套规则给出：OSS 默认域名对
            # `.apk` / `.ipa` 下载返回 400（ApkDownloadForbidden），故会被加上
            # `.bin` 后缀上传（香港走的是 CNAME 自定义域，本不受此限，但为与
            # 广州保持同一份索引形状，仍沿用同一套命名）；索引里的
            # browser_download_url 与这里保持一致。
            obj="$(python3 tool/oss_index.py --delivery-name "$(basename "$f")")"
            ossgz cp "$f" "oss://${OSS_BUCKET}/${prefix}/${obj}" -f --acl public-read \
              --meta "Content-Type:application/octet-stream"
            osshk cp "$f" "oss://${OSS_HK_BUCKET}/${prefix}/${obj}" -f --acl public-read \
              --meta "Content-Type:application/octet-stream"
            echo "uploaded ${obj} (guangzhou + hongkong)"
          done

      - name: Build & upload releases index
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          ver="${GITHUB_REF#refs/tags/v}"
          prefix="downloads/${ver}"
          ossgz() { "$OSSUTIL" "$@" -e "$OSS_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"; }
          osshk() { "$OSSUTIL" "$@" -e "$OSS_HK_ENDPOINT" -i "$OSS_ACCESS_KEY_ID" -k "$OSS_ACCESS_KEY_SECRET"; }
          shopt -s nullglob
          files=(APRSLocus-Windows/*.exe APRSLocus-Android/*.apk APRSLocus-iOS/*.ipa)
          # 广州：url-base 用默认域名（客户端就读这个）。线上旧索引可能不存在 → 忽略。
          ossgz cp "oss://${OSS_BUCKET}/${OSS_INDEX_KEY}" /tmp/existing_gz.json -f || true
          python3 tool/oss_index.py --ver "$ver" \
            --url-base "https://${OSS_BUCKET}.${OSS_ENDPOINT}/${prefix}" \
            --changelog CHANGELOG.md --existing /tmp/existing_gz.json \
            --out /tmp/releases_gz.json "${files[@]}"
          ossgz cp /tmp/releases_gz.json "oss://${OSS_BUCKET}/${OSS_INDEX_KEY}" -f --acl public-read
          # 香港：客户端走 CNAME 自定义域，所以 url-base 必须用 OSS_HK_DOMAIN，
          # 否则 App 走香港渠道会去下 oss-cn-hongkong 默认域名的对象（可能 400/慢）。
          osshk cp "oss://${OSS_HK_BUCKET}/${OSS_INDEX_KEY}" /tmp/existing_hk.json -f || true
          python3 tool/oss_index.py --ver "$ver" \
            --url-base "https://${OSS_HK_DOMAIN}/${prefix}" \
            --changelog CHANGELOG.md --existing /tmp/existing_hk.json \
            --out /tmp/releases_hk.json "${files[@]}"
          osshk cp /tmp/releases_hk.json "oss://${OSS_HK_BUCKET}/${OSS_INDEX_KEY}" -f --acl public-read

      - name: Verify (anonymous, same as the app)
        if: steps.creds.outputs.configured == 'true'
        run: |
          set -euo pipefail
          # 两个节点都用**客户端实际会请求的地址**做匿名自检：广州=默认域名，
          # 香港=CNAME 自定义域。索引读不到、或任一资产拿不到 200/206，都当场失败。
          verify() {
            local label="$1" url="$2" urls="$3"
            local body
            body="$(curl -fsS "$url")" || {
              echo "::error::[$label] 匿名读取 $url 失败 —— bucket 未开公共读，或对象 ACL 不是 public-read。"
              echo "::error::[$label] 请把该 bucket 读权限设为「公共读」，否则 App 走这条渠道会拿到 403。"
              exit 1
            }
            echo "$body" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and d and d[0].get("assets"); print("index OK:", d[0]["tag_name"], len(d[0]["assets"]), "assets")'
            echo "$body" | python3 -c 'import json,sys; [print(a["browser_download_url"]) for a in json.load(sys.stdin)[0]["assets"]]' > "$urls"
            while read -r u; do
              code="$(curl -s -o /dev/null -w '%{http_code}' -r 0-0 "$u")"
              if [ "$code" != "200" ] && [ "$code" != "206" ]; then
                echo "::error::[$label] 匿名下载失败 HTTP $code：$u"
                exit 1
              fi
              echo "[$label] download OK ($code): $u"
            done < "$urls"
          }
          verify gz "https://${OSS_BUCKET}.${OSS_ENDPOINT}/${OSS_INDEX_KEY}" /tmp/oss_urls_gz.txt
          verify hk "https://${OSS_HK_DOMAIN}/${OSS_INDEX_KEY}" /tmp/oss_urls_hk.txt
