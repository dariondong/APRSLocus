name: Sync upstream and localize new UI
on:
  push:
    branches: [i18n/complete-english]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: i18n/complete-english
          fetch-depth: 0

      - name: Merge latest upstream
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git remote add upstream https://github.com/dariondong/APRSLocus.git
          git fetch upstream main
          echo "Upstream HEAD: $(git rev-parse upstream/main)"
          set +e
          git merge --no-commit --no-ff upstream/main
          rc=$?
          set -e
          echo "merge exit: $rc"
          test -f .git/MERGE_HEAD
          # The Actions token cannot push workflow-file changes. Keep our release
          # workflow tree entry unchanged; upstream workflow-only commits still
          # remain in merge ancestry and won't be re-merged later.
          git checkout HEAD -- .github/workflows/build-release.yml
          python3 .github/i18n_upstream_sync.py
          git add lib/home_page.dart lib/map_page.dart lib/messages_page.dart \
                  lib/settings_pages.dart lib/stations_page.dart \
                  lib/l10n/app_zh.arb lib/l10n/app_en.arb \
                  .github/workflows/build-release.yml
          if [ -n "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Unresolved files:"
            git diff --name-only --diff-filter=U
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate localizations
        shell: bash
        run: |
          flutter pub get
          flutter gen-l10n

      - name: Format localized Dart
        shell: bash
        run: |
          dart format \
            lib/home_page.dart \
            lib/map_page.dart \
            lib/messages_page.dart \
            lib/settings_pages.dart \
            lib/stations_page.dart \
            lib/models.dart \
            lib/state.dart \
            lib/widgets.dart

      - name: Check newly introduced Chinese UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              'lib/home_page.dart','lib/map_page.dart','lib/messages_page.dart',
              'lib/settings_pages.dart','lib/stations_page.dart'
          ]
          print('=== CJK string literals in upstream-touched UI files ===')
          lit = re.compile(r"(['\"])(?:(?!\1).)*[\u4e00-\u9fff](?:(?!\1).)*\1")
          non_comment = {}
          for name in files:
              kept=[]
              for i,line in enumerate(Path(name).read_text(encoding='utf-8').splitlines(),1):
                  s=line.strip()
                  if s.startswith('//') or s.startswith('///'):
                      continue
                  kept.append(line)
                  if lit.search(line): print(f'{name}:{i}: {s}')
              non_comment[name]='\n'.join(kept)
          forbidden = [
              'Passcode 未验证','登录密码可能错误，无法正常收发消息',
              '配置已修改','重新连接后生效','已重新连接','连接失败，请检查配置',
              'APRS-IS 登录验证码，填 -1 无法正常收发消息',
              "'-1 未验证'", "'未验证'", "'静止'", "'暂无成员'", "'移除'",
              "'邀请成员'", "'删除群组'", "'退出群组'", "'群主'",
              "'搜索呼号…'", "'手动输入呼号'", "'已邀请'", "'点击邀请'"
          ]
          bad=[]
          for name,t in non_comment.items():
              for x in forbidden:
                  if x in t: bad.append((name,x))
          if bad:
              print('=== FORBIDDEN untranslated UI remnants ===')
              for x in bad: print(x)
              raise SystemExit(1)
          PY

      - name: Analyze merged localization
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee /tmp/analyze.log
          set -e
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('/tmp/analyze.log').read_text(encoding='utf-8').splitlines()
          errors=[x for x in lines if ' error • ' in x]
          bad=[x for x in errors if not ('lib/vector_map.dart:' in x and 'argument_type_not_assignable' in x)]
          print('Analyzer errors:', len(errors))
          for x in errors: print(x)
          if bad:
              print('Unexpected analyzer errors:')
              for x in bad: print(x)
              raise SystemExit(1)
          PY

      - name: Commit upstream sync
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # Delete only the helper script here. Workflow files are cleaned up
          # through the repository API after this push succeeds.
          git rm .github/i18n_upstream_sync.py
          git add -A
          echo "=== final status ==="
          git status --short
          git commit -m "merge: sync upstream 1.5.3 and translate new UI"
          git push origin HEAD:i18n/complete-english
