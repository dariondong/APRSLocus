 c.translate(W-52,H-120);c.rotate(-Math.PI/2);c.fillText("APRSLOCUS · FIRST MEMBER · 73",0,0);c.restore();

 c.fillStyle="#eef0f6";c.fillRect(58,H-66,W-116,1);

 c.textAlign="right";c.fillText(TX[lang].foot,W-58,H-36);c.textAlign="left";
 c.restore();
 /* 外细边 */
 rr(c,P,P,W-P*2,H-P*2,R);c.lineWidth=1;c.strokeStyle="#e4e8f1";c.stroke();
