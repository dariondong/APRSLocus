<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRSlocus · 荣誉墙</title>
<meta name="description" content="APRSlocus 荣誉墙 — 成员徽章与成就">
<meta property="og:title" content="APRSlocus 荣誉墙">
<meta property="og:image" content="https://aprslocus.theez.top/assets/logo.png">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(165deg,#fafbfe,#f0f2f8 55%,#e9ecf4);color:#131c30;
    -webkit-font-smoothing:antialiased}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;background:rgba(244,246,251,.72);backdrop-filter:blur(8px);border-bottom:1px solid rgba(30,50,90,.06)}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none}
  .brand img{width:26px;height:26px;border-radius:7px;background:#fff;box-shadow:0 4px 10px rgba(20,30,60,.12)}
  .brand b{font-size:14.5px;color:#141c30}
  .langs{display:flex;gap:3px}
  .langs button{font:inherit;font-size:12.5px;color:#7b879d;background:transparent;border:0;border-radius:8px;padding:4px 10px;cursor:pointer}
  .langs button.on{color:#10192e;font-weight:700;background:#fff;box-shadow:0 2px 8px rgba(20,35,70,.07)}
  .wrap{max-width:1000px;margin:0 auto;padding:clamp(24px,5vh,52px) 16px 10px}
  /* hero */
  .hero{text-align:center;margin-bottom:34px}
  .hero .st{display:inline-block;font-size:11px;letter-spacing:3px;color:#b08a34;border:1px solid rgba(176,138,52,.35);border-radius:999px;padding:5px 16px;margin-bottom:14px}
  .hero h1{font-size:clamp(26px,5vw,44px);font-weight:900;letter-spacing:-.02em}
  .hero h1 em{font-style:normal;background:linear-gradient(90deg,#0c2f7a,#0ea5c4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{color:#7b879d;font-size:14px;margin-top:8px}
  /* 分组区 */
  .group{margin:0 0 30px}
  .gh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .gh .dot{width:8px;height:8px;border-radius:50%}
  .gh h3{font-size:15px;font-weight:800;letter-spacing:.5px}
  .gh span{color:#a3adc0;font-size:12px;margin-left:auto}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .mcard{background:#fff;border:1px solid #e9ecf4;border-radius:18px;padding:18px 12px 14px;text-align:center;cursor:pointer;
    transition:.2s cubic-bezier(.2,.8,.2,1);box-shadow:0 10px 26px -22px rgba(20,35,70,.6)}
  .mcard:hover{transform:translateY(-4px);border-color:#cdd8ec;box-shadow:0 20px 40px -24px rgba(20,35,70,.6)}
  .mcard.grp{cursor:default}
  .mcard.grp:hover{transform:none}
  .av{width:52px;height:52px;border-radius:16px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
    font-size:20px;font-weight:900;color:#fff;box-shadow:0 8px 18px rgba(20,35,70,.18)}
  .mcard .call{font-size:15px;font-weight:900;letter-spacing:1px;font-family:ui-monospace,'SF Mono',Consolas,monospace}
  .mcard .who{font-size:12px;color:#6a7590;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mcard .role{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;color:#54617c;background:#eef1f8;border-radius:999px;padding:3px 9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .mcard .tag2{display:inline-block;margin-top:8px;font-size:10px;font-weight:700;color:#0e7a4d;background:#e6f6ee;border-radius:999px;padding:3px 9px}
  .mcard .heart{margin-top:8px;font-size:13px}
  /* 会员卡预览 */
  .prehead{display:flex;align-items:center;gap:10px;margin:8px 0 16px}
  .prehead::after{content:"";flex:1;height:1px;background:rgba(30,50,90,.08)}
  .prehead b{font-size:14px;letter-spacing:1px}
  .pre{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
  canvas{display:block;width:100%;height:auto;border-radius:22px;
    box-shadow:0 30px 70px -32px rgba(20,35,70,.45),0 2px 10px rgba(20,35,70,.05)}
  .profile{margin-top:26px;width:100%;background:rgba(255,255,255,.9);border:1px solid rgba(30,50,90,.08);
    border-radius:20px;padding:clamp(20px,4vw,32px);box-shadow:0 18px 44px -30px rgba(20,35,70,.4)}
  .p-top{display:flex;gap:18px;align-items:center}
  .p-av{flex:0 0 auto;width:72px;height:72px;border-radius:22px;color:#fff;font:900 28px Consolas,monospace;
    display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(20,35,70,.4)}
  .p-id{min-width:0;flex:1}
  .p-call{font-size:clamp(24px,4vw,34px);font-weight:900;letter-spacing:1.5px;font-family:ui-monospace,Consolas,monospace;line-height:1.1}
  .p-who{color:#6a7590;font-size:14.5px;margin-top:6px}
  .p-honors{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .p-honors .honor{display:inline-flex;text-decoration:none;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
    background:#fff;border:1px solid;border-radius:999px;padding:4px 12px;box-shadow:0 2px 8px rgba(20,35,70,.05)}
  .p-honors .honor .hd{width:8px;height:8px;border-radius:50%}
  .p-hr{height:1px;background:rgba(30,50,90,.08);margin:22px 0}
  .p-sec h4{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:2.5px;color:#8b95a9;font-weight:700;margin-bottom:10px}
  .p-sec h4::after{content:"";flex:1;height:1px;background:rgba(30,50,90,.06)}
  .p-sec p{color:#303d58;font-size:15.5px;line-height:1.95}
  .p-quote{display:flex;gap:12px;margin-top:20px;padding:16px 20px;border-radius:14px;background:#f7f9fd;border-left:3px solid}
  .p-quote .qm{font-size:24px;line-height:1;color:#c9d0dd;font-family:Georgia,serif}
  .p-quote p{color:#44506b;font-size:14.5px;line-height:1.8;font-style:italic}
  .p-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
  .tag{font-size:12px;font-weight:600;color:#54617c;background:#eef1f8;border-radius:999px;padding:5px 13px}
  .tag{font-size:12px;font-weight:600;color:#54617c;background:#eef1f8;border-radius:999px;padding:5px 13px}
  .ctrl{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:24px;flex-wrap:wrap}
  .ct{font:inherit;font-size:14px;color:#39435e;background:transparent;border:0;border-radius:11px;padding:10px 17px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .ct:hover{background:#fff;box-shadow:0 4px 12px rgba(20,35,70,.08)}
  .ct svg{width:15px;height:15px}
  .ct.prim{font-weight:700;color:#fff;background:#16213b;box-shadow:0 12px 24px -14px rgba(20,30,55,.8)}
  .sep{width:1px;height:20px;background:#d7dbe6;margin:0 8px}
  .calls{display:inline-flex;gap:3px;flex-wrap:wrap;justify-content:center}
  .calls button{font:inherit;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;color:#98a1b4;background:transparent;border:0;border-radius:9px;padding:6px 9px;cursor:pointer}
  .calls button.on{color:#10192e;background:#fff;font-weight:700;box-shadow:0 3px 10px rgba(20,35,70,.1)}
  .foot{margin:34px 0 26px;color:#9aa3b6;font-size:12.5px;text-align:center}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);background:#16213b;color:#fff;font-size:13px;padding:10px 20px;border-radius:11px;opacity:0;transition:.28s;z-index:60;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media(max-width:520px){.p-role{margin-left:0}}
</style>
</head>

 const n=(navigator.language||"zh-CN").toLowerCase();return n.startsWith("zh-tw")||n.startsWith("zh-hk")?"zh-TW":n.startsWith("en")?"en":"zh";}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

let FIRSTFIX_HOLDERS=new Set();
function isFF(call){const b=String(call||"").toUpperCase().split("-")[0];return FIRSTFIX_HOLDERS.has(b);}
function honorDefsOf(p){
  // p.honors 显式，否则按 grp 映射默认
  let list = p&&p.honors&&p.honors.length? p.honors.slice() : []; 
  if(!list.length){ const g=(p&&p.grp)||""; if(g==="core"||g==="developer")list=["kaishan","developer","earlyMember"]; else if(g==="support")list=["earlyMember","mostBrain"]; else list=["earlyMember"]; }
  // 官网 firstfix.json 授勋命中 → 追加 FIRST FIX
  if(p&&p.call&&isFF(p.call)&&!list.includes("firstFix")) list.push("firstFix");
  return list;
}

function pick(i){idx=((i%CARDS.length)+CARDS.length)%CARDS.length;
 const c=cur();const u=new URL(location);
 if(c.kind==="p")u.searchParams.set("call",c.p.call);else u.searchParams.delete("call");

 history.replaceState(null,"",u);ui();draw();profile();

function ui(){
 document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(TX[lang][k]!=null)e.textContent=TX[lang][k];});

 CARDS.forEach((c,i)=>{const b=document.createElement("button");
  b.textContent=c.kind==="p"?c.p.call:labelOf(c);

function wallSection(hkey, people){
 const hc=honorColor(hkey); const hname=honorLabel(hkey);
 return `<div class="group"><div class="gh"><span class="dot" style="background:${hc}"></span>

  <div class="cards">${people.map(p=>`

     <div class="av" style="background:linear-gradient(140deg,${hc},${hc})">${(p.call.replace(/[0-9-]/g,"")[0]||"A").toUpperCase()}</div>

     <div class="role">${hname}</div>
   </div>`).join("")}

function walls(){

 for(const hk of honorOrder){
   const holders=PEOPLE.filter(p=>honorDefsOf(p).includes(hk));
   if(holders.length) html+=wallSection(hk,holders);
 }
 // 团体（赞助类）单独保留底部

 }
 document.getElementById("walls").innerHTML=html;}

function draw(){
 const c=cur();const g=cardColor(c);const c2=cv.getContext("2d");
 cv.width=W*SF;cv.height=H*SF;c2.scale(SF,SF);c2.clearRect(0,0,W,H);
 const R=24,P=1;
 rr(c2,P,P,W-P*2,H-P*2,R);c2.fillStyle="#ffffff";c2.fill();c2.save();c2.clip();
 const tint=c2.createRadialGradient(W*.9,0,20,W*.9,0,W*.5);tint.addColorStop(0,hexA(g,.10));tint.addColorStop(1,"rgba(255,255,255,0)");
 c2.fillStyle=tint;c2.fillRect(0,0,W,H);
 c2.fillStyle=g;c2.fillRect(P,P,W-P*2,5);
 const tx=58,ty=52,lw=46;
 if(logoImg){c2.save();rr(c2,tx,ty-lw/2,lw,lw,13);c2.fillStyle="#fff";c2.strokeStyle="#e7eaf2";c2.lineWidth=1;c2.stroke();rr(c2,tx,ty-lw/2,lw,lw,13);c2.clip();c2.drawImage(logoImg,tx,ty-lw/2,lw,lw);c2.restore();}
 c2.fillStyle="#141e38";c2.font="800 26px 'Segoe UI','PingFang SC',sans-serif";c2.fillText("APRSlocus",tx+lw+16,ty+2);
 c2.fillStyle="#8b95a9";c2.font="600 13px 'Segoe UI','PingFang SC',sans-serif";
 c2.save();c2.letterSpacing="1.6px";c2.fillText(TX[lang].mem,tx+lw+16,ty+26);c2.restore();
 // 右上角保持干净（不渲染荣誉/早期文案，避免与下方重复）
 c2.fillStyle="#8b95a9";c2.font="700 14px Consolas,monospace";c2.textAlign="right";
 c2.fillText((idx+1)+" / "+CARDS.length,W-58,100);c2.textAlign="left";
 c2.fillStyle="#eef1f7";c2.fillRect(58,132,W-116,1);
 const cx=58,cy0=278;
 if(c.kind==="p"){
  c2.fillStyle="#0d1426";c2.font="800 132px 'SF Mono','Consolas',ui-monospace,monospace";c2.fillText(c.p.call,cx,cy0+2);
  c2.fillStyle=g;c2.fillRect(cx,cy0+56,72,4);
  c2.fillStyle="#182238";c2.font="700 30px 'PingFang SC','Segoe UI',sans-serif";c2.fillText(c.p.who?(c.p.who[lang]||c.p.who.zh):"",cx,cy0+128);
  // 姓名下：渲染荣誉徽章（依次小胶囊）
  const hkeys=honorDefsOf(c.p);
  if(hkeys.length){
    let hx=cx;
    c2.font="600 15px 'PingFang SC','Segoe UI',sans-serif";
    for(const k of hkeys){
      const hc=honorColor(k); const lbl=honorLabel(k);
      const w=c2.measureText(lbl).width;
      c2.save();rr(c2,hx,cy0+148,w+26,30,15);c2.fillStyle=hexA(hc,.15);c2.fill();
      c2.strokeStyle=hc;c2.lineWidth=1;c2.stroke();c2.restore();
      c2.fillStyle=hc;c2.fillText(lbl,hx+13,cy0+169);
      hx += w+26+10;
    }
  } else {
    // 无荣誉回退显示角色
    const role=T(c.p.role);c2.font="600 17px 'PingFang SC','Segoe UI',sans-serif";
    c2.fillStyle="#4c5770";c2.fillText(role,cx,cy0+170);
  }
  c2.fillStyle="#7c8699";c2.font="500 19px 'PingFang SC','Segoe UI',sans-serif";
  c2.fillText("“"+T(c.p.brief)+"”",cx,cy0+240);
 } else {
  const gname=T(c.g.name);
  const fs=(gname.length>10)?52:96;
  c2.fillStyle="#0d1426";c2.font="800 "+fs+"px 'PingFang SC','Segoe UI',sans-serif";c2.fillText(gname,cx,cy0+8);
  c2.fillStyle=g;c2.fillRect(cx,cy0+70,72,4);
  c2.fillStyle="#182238";c2.font="700 28px 'PingFang SC','Segoe UI',sans-serif";c2.fillText(T(c.g.role),cx,cy0+150);
  c2.fillStyle="#7c8699";c2.font="500 19px 'PingFang SC','Segoe UI',sans-serif";
  c2.fillText("“"+T(c.g.note)+"”",cx,cy0+220);
 }
 c2.fillStyle="#eef0f6";c2.fillRect(58,H-82,W-116,1);
 c2.fillStyle="#9aa4b8";c2.font="700 18px Consolas,monospace";c2.fillText("# "+(idx+1),58,H-44);
 c2.fillStyle="#7c8699";c2.font="500 17px 'PingFang SC','Segoe UI',sans-serif";
 c2.textAlign="right";c2.fillText(TX[lang].foot,W-58,H-44);c2.textAlign="left";
 c2.restore();
 rr(c2,P,P,W-P*2,H-P*2,R);c2.lineWidth=1;c2.strokeStyle="#e4e8f1";c2.stroke();
}

 if(c.kind==="p"){
  const m=c.p;const who=m.who?(m.who[lang]||m.who.zh):"";
  const contrib=T(m.contrib),quote=T(m.quote),tags=T(m.tags),role=T(m.role);
  box.innerHTML=`<div class="p-top">

function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600);}
function exportPng(){const a=document.createElement("a");
 const c=cur();const nm=c.kind==="p"?c.p.call:T(c.g.name).replace(/\s+/g,"-");
 a.download="APRSlocus-"+nm+".png";a.href=cv.toDataURL("image/png");a.click();toast(TX[lang].saved);}
function applyRemote(d){
 if(!d) return;
 if(d.honors){ HONOR_DEFS = d.honors||{}; }
 const norm=(v)=>String(v==null?"":v).toUpperCase();
 // members.json: developers/earlyMembers 可为对象数组（含 call/who/role...）或纯呼号字符串
 const toPeople=(arr,defGrp)=>{
   const out=[];
   (arr||[]).forEach(it=>{
     const call = typeof it==="string" ? it : it.call;
     if(!call) return;
     const b=PEOPLE.find(p=>norm(p.call)===norm(call));
     if(typeof it==="string"){ if(b) out.push(b); return; }
     out.push({
       call: String(call),
       who: it.who||(b?b.who:null)||{zh:String(call)},
       role: it.role||(b?b.role:null)||{zh:"",en:""},
       brief: it.brief||(b?b.brief:null)||{zh:"",en:""},
       contrib: it.contrib||(b?b.contrib:null)||{zh:"",en:""},
       quote: it.quote||(b?b.quote:null)||{zh:"",en:""},
       tags: it.tags||(b?b.tags:null)||{zh:[],en:[]},
       c: it.c||(b?b.c:"#7a879d"),
       grp: it.grp||(b?b.grp:defGrp),
       honors: it.honors||(b?b.honors:null),
     });
   });
   return out;
 };
 const dev=toPeople(d.developers,"core");
 const early=toPeople(d.earlyMembers,"test");
 const merged=dev.concat(early);
 if(merged.length>0) PEOPLE=merged;
 if(Array.isArray(d.groups)&&d.groups.length>0){
   GROUPS=d.groups.map(g=>({name:g.name,role:g.role,note:g.note,c:g.c||"#7c5cff"}));
 }
 rebuildCards();
 // 尽量保留当前 ?call 选中
 const qc2=new URLSearchParams(location.search).get("call");
 if(qc2){const fi2=CARDS.findIndex(x=>x.kind==="p"&&norm(x.p.call)===norm(qc2));if(fi2>=0)idx=fi2;}
 ui();walls();profile();draw();
}
lang=detect();
const qc=new URLSearchParams(location.search).get("call");
const fi=qc?CARDS.findIndex(x=>x.kind==="p"&&x.p.call.toUpperCase()===(qc||"").toUpperCase()):-1;if(fi>=0)idx=fi;
ui();walls();profile();draw();
/* 从同目录 members.json 拉取最新名单/资料（与 App 徽标共用数据源，改名单无需发版） */
fetch("members.json").then(r=>r.ok?r.json():null).then(d=>applyRemote(d)).catch(()=>{});
/* 加载 FIRST FIX 授勋名单（官网 firstfix.json） */
fetch("firstfix.json").then(r=>r.ok?r.json():null).then(d=>{
  if(d&&Array.isArray(d.holders)){
    d.holders.forEach(h=>{if(h&&String(h).trim())FIRSTFIX_HOLDERS.add(String(h).trim().toUpperCase());});
    ui();walls();profile();draw();
  }
}).catch(()=>{});
