<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;font-family:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(160deg,#f7f8fb,#eceef4 55%,#e6e9f1);
    color:#10192e;display:flex;flex-direction:column;align-items:center;
    padding:clamp(20px,5vh,48px) 16px 40px;
    -webkit-font-smoothing:antialiased;
  }
  /* 极简顶部：只留一个小 logo 角标 + 语言 */
  .top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
    padding:12px 18px;z-index:20}
  .brand{display:flex;align-items:center;gap:8px;text-decoration:none}
  .brand img{width:26px;height:26px;border-radius:7px}
  .brand b{font-size:14px;letter-spacing:-.01em;color:#10192e}
  .langs{display:flex;gap:3px}
  .langs button{font:inherit;font-size:12px;color:#8a94a8;background:transparent;border:0;border-radius:8px;
    padding:4px 8px;cursor:pointer}
  .langs button.on{color:#10192e;font-weight:700;background:rgba(255,255,255,.8)}
  .langs button:not(.on):hover{color:#10192e}

  /* 中部：单张卡，干净留白 */
  canvas{display:block;width:min(560px,92vw);height:auto;border-radius:20px;margin-top:clamp(30px,10vh,72px);
    box-shadow:0 24px 60px -24px rgba(28,42,74,.35)}
  /* 名字 + 身份（卡下极简说明） */
  .meta{margin-top:22px;text-align:center}
  .meta .nm{font-size:17px;font-weight:700;letter-spacing:.02em}
  .meta .st{font-size:12.5px;color:#8a94a8;margin-top:3px}
  /* 极简控件：一字排开，细分割 */
  .ctrl{display:flex;align-items:center;gap:4px;margin-top:24px;flex-wrap:wrap;justify-content:center}
  .ct{font:inherit;font-size:13.5px;color:#36405a;background:transparent;border:0;border-radius:10px;
    padding:9px 15px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
  .ct:hover{background:rgba(255,255,255,.75)}
  .ct svg{width:15px;height:15px}
  .ct.prim{font-weight:700;color:#fff;background:#16213b;box-shadow:0 10px 22px -10px rgba(20,30,55,.6)}
  .ct.prim:hover{background:#101a30}
  .sep{width:1px;height:18px;background:#d9dde7;margin:0 6px}
  .calls{display:inline-flex;gap:3px;flex-wrap:wrap}
  .calls button{font:inherit;font-size:12px;font-family:ui-monospace,'SF Mono',Consolas,monospace;color:#8a94a8;
    background:transparent;border:0;border-radius:8px;padding:5px 8px;cursor:pointer}
  .calls button.on{color:#10192e;background:#fff;font-weight:700}
  .calls button:not(.on):hover{color:#10192e}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);
    background:#16213b;color:#fff;font-size:12.5px;padding:9px 18px;border-radius:10px;opacity:0;
    transition:.28s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .foot{margin-top:36px;color:#aab2c4;font-size:12px;letter-spacing:.01em}
  @media(max-width:520px){ .top{position:static;margin-bottom:6px} canvas{margin-top:8px} }
</style>

const W=1000,H=620,SF=2.5;
let lang="zh",idx=0;const cv=document.getElementById("cv");
function detect(){const q=new URLSearchParams(location.search);if(q.get("lang"))return q.get("lang");
 const n=(navigator.language||"zh-CN").toLowerCase();return n.startsWith("zh-tw")||n.startsWith("zh-hk")?"zh-TW":n.startsWith("en")?"en":"zh";}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function setLang(l){lang=l;const u=new URL(location);if(l!=="zh")u.searchParams.set("lang",l);else u.searchParams.delete("lang");history.replaceState(null,"",u);sync();draw();updateMeta();}
function go(i){idx=((i%MEMBERS.length)+MEMBERS.length)%MEMBERS.length;
 const u=new URL(location);u.searchParams.set("call",MEMBERS[idx].call);if(lang!=="zh")u.searchParams.set("lang",lang);else u.searchParams.delete("lang");history.replaceState(null,"",u);sync();draw();updateMeta();}
function next(){go(idx+1);}
function updateMeta(){const m=MEMBERS[idx];
 document.getElementById("who").textContent=m.who[lang]||m.who.zh;
 document.getElementById("role").textContent=m.role[lang]||m.role.zh;}
function sync(){
 document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(TX[lang][k]!=null)e.textContent=TX[lang][k];});
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
 const calls=document.getElementById("calls");calls.innerHTML="";
 MEMBERS.forEach((m,i)=>{const b=document.createElement("button");b.textContent=m.call;if(i===idx)b.classList.add("on");
  b.onclick=()=>go(i);calls.appendChild(b);});
 document.documentElement.lang=lang==="zh"?"zh-CN":lang==="zh-TW"?"zh-Hant":"en";}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);
 return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function draw(){
 const m=MEMBERS[idx];const c=cv.getContext("2d");
 cv.width=W*SF;cv.height=H*SF;c.scale(SF,SF);c.clearRect(0,0,W,H);
 const R=26,pad=1;
 /* —— 白卡（极简） —— */
 rr(c,pad,pad,W-pad*2,H-pad*2,R);c.fillStyle="#ffffff";c.fill();
 c.save();c.clip();
 /* 顶部大面积渐变（非常淡的 accent tint） */
 const tg=c.createLinearGradient(0,0,0,H*.66);
 tg.addColorStop(0,hexA(m.c,.07));tg.addColorStop(1,"rgba(255,255,255,0)");
 c.fillStyle=tg;c.fillRect(0,0,W,H);
 /* 细 accent 上边线 */
 c.fillStyle=m.c;c.fillRect(pad,pad,W-pad*2,3);

 /* —— 排版：右上角小组 —— */
 const gx=W-44,gy=48,gl=40;
 /* logo 圆形白章（细描边） */
 c.save();
 c.beginPath();c.arc(gx,gy,gl/2,0,Math.PI*2);
 c.fillStyle="#fff";c.fill();c.lineWidth=1.2;c.strokeStyle="#e6e9f1";c.stroke();
 if(typeof logoImg!=="undefined"&&logoImg){c.save();c.beginPath();c.arc(gx,gy,gl/2-1,0,Math.PI*2);c.clip();c.drawImage(logoImg,gx-gl/2,gy-gl/2,gl,gl);c.restore();}
 c.restore();
 /* 徽标文字 */
 c.textAlign="right";c.fillStyle="#141c30";c.font="700 15px 'Segoe UI','PingFang SC',sans-serif";
 c.fillText("APRSlocus",W-70,42);
 c.fillStyle="#9aa2b6";c.font="600 10px 'Segoe UI',sans-serif";c.letterSpacing="3px";
 c.fillText(TX[lang].mem,W-70,60);c.letterSpacing="0px";c.textAlign="left";

 /* —— 中部大呼号 —— */
 const cx=76;
 c.fillStyle="#121a2e";c.font="800 84px 'SF Mono','Consolas',monospace";
 c.fillText(m.call,cx,268);
 /* 细 accent 线（很短，克制） */
 c.fillStyle=m.c;c.fillRect(cx,300,54,3);
 /* 名字 */
 c.fillStyle="#1b253c";c.font="600 22px 'PingFang SC','Segoe UI',sans-serif";
 c.fillText(m.who[lang]||m.who.zh,cx,348);
 /* 角色（灰） */
 c.fillStyle="#99a1b5";c.font="500 15px 'PingFang SC','Segoe UI',sans-serif";
 c.fillText(m.role[lang]||m.role.zh,cx,378);

 /* —— 底部细行 —— */
 c.fillStyle="#aeb6c8";c.font="500 12.5px 'PingFang SC','Segoe UI',sans-serif";
 c.fillText(TX[lang].foot,cx,H-52);
 c.fillStyle="#c6ccd8";c.font="500 12px 'PingFang SC',sans-serif";
 c.textAlign="right";c.fillText(m.call,cx,H-52);c.textAlign="left";
 c.restore();
 /* 外细描边 */
 rr(c,pad,pad,W-pad*2,H-pad*2,R);c.lineWidth=1;c.strokeStyle="#e7eaf2";c.stroke();
}
