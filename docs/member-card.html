<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100vh;font-family:"Inter","PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#131c30;display:flex;flex-direction:column;align-items:center;
    background:linear-gradient(165deg,#fafbfe,#f0f2f8 55%,#eceff6);
    -webkit-font-smoothing:antialiased;padding:clamp(18px,4vh,44px) 14px 50px}
  .top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;z-index:30}
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none}
  .brand img{width:26px;height:26px;border-radius:7px;background:#fff;box-shadow:0 4px 10px rgba(20,30,60,.14)}
  .brand b{font-size:14.5px;color:#131c30}
  .langs{display:flex;gap:3px}
  .langs button{font:inherit;font-size:12px;color:#8b95aa;background:transparent;border:0;border-radius:8px;padding:4px 9px;cursor:pointer}
  .langs button.on{color:#131c30;font-weight:700;background:#fff;box-shadow:0 2px 8px rgba(20,35,70,.08)}
  .langs button:not(.on):hover{color:#131c30}
  .wrap{width:100%;max-width:720px;margin-top:clamp(30px,8vh,64px);display:flex;flex-direction:column;align-items:center}
  /* 会员卡 */
  canvas.card{width:100%;max-width:660px;height:auto;border-radius:22px;
    box-shadow:0 30px 70px -26px rgba(18,32,64,.42),0 3px 10px rgba(18,32,64,.07)}
  /* 卡下控件 */
  .ctrl{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:18px;flex-wrap:wrap}
  .ct{font:inherit;font-size:13.5px;color:#39435e;background:#fff;border:1px solid #e4e8f1;border-radius:10px;padding:8px 15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s;box-shadow:0 4px 14px -6px rgba(20,35,70,.18)}
  .ct:hover{border-color:#c9d3e6}
  .ct svg{width:15px;height:15px}
  .ct.prim{font-weight:700;color:#fff;background:#16213b;border-color:#16213b;box-shadow:0 10px 24px -10px rgba(20,30,55,.6)}
  .ct.prim:hover{background:#0f1830}
  .sep{width:1px;height:20px;background:#dde2ec;margin:0 8px}
  .calls{display:inline-flex;gap:2px;flex-wrap:wrap}
  .calls button{font:inherit;font-size:12px;font-family:ui-monospace,'SF Mono',Consolas,monospace;color:#96a0b4;background:transparent;border:0;border-radius:8px;padding:5px 8px;cursor:pointer}
  .calls button.on{color:#131c30;background:#fff;font-weight:700;box-shadow:0 2px 8px rgba(20,35,70,.08)}
  .calls button:not(.on):hover{color:#131c30}
  /* 下方资料区 */
  .profile{width:100%;max-width:660px;background:#fff;border:1px solid #e9ecf4;border-radius:22px;
    margin-top:22px;padding:30px clamp(20px,5vw,38px) 28px;box-shadow:0 16px 44px -30px rgba(18,32,64,.4)}
  .p-call{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .p-call .c1{font-family:'SF Mono',ui-monospace,Consolas,monospace;font-size:30px;font-weight:900;letter-spacing:.5px}
  .p-call .c2{font-size:16px;font-weight:700;color:#3a445e}
  .p-role{display:inline-block;margin-top:12px;font-size:13px;font-weight:700;color:#fff;background:#16213b;border-radius:999px;padding:5px 14px}
  .p-num{margin-left:8px;font-size:12px;font-weight:700;font-family:Consolas,monospace;color:#97a2b8}
  .p-brief{margin-top:18px;font-size:15.5px;line-height:1.9;color:#31405e}
  .p-words{margin-top:16px;border-left:3px solid #dfe4ee;padding:2px 0 2px 16px;color:#8490a8;font-size:14px;line-height:1.85}
  .p-div{height:1px;background:#eff1f7;margin:20px 0 16px}
  .p-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#97a2b8;font-size:12px}
  .p-foot b{color:#4a5670;font-size:12.5px}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(90px);background:#16213b;color:#fff;
    font-size:12.5px;padding:10px 20px;border-radius:10px;opacity:0;transition:.28s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media(max-width:540px){.top{position:static;margin-bottom:4px}.wrap{margin-top:10px}.p-call .c1{font-size:25px}}
</style>

function sync(){
 document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(TX[lang][k]!=null)e.textContent=TX[lang][k];});
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
 const cl=document.getElementById("calls");cl.innerHTML="";
 MEMBERS.forEach((m,i)=>{const b=document.createElement("button");b.textContent=m.call;if(i===idx)b.classList.add("on");b.onclick=()=>go(i);cl.appendChild(b);});
 document.documentElement.lang=lang==="zh"?"zh-CN":lang==="zh-TW"?"zh-Hant":"en";}
function draw(){
 const m=MEMBERS[idx];const c=cv.getContext("2d");
 cv.width=W*SF;cv.height=H*SF;c.scale(SF,SF);c.clearRect(0,0,W,H);
 const R=24,P=1;
 rr(c,P,P,W-P*2,H-P*2,R);c.fillStyle="#ffffff";c.fill();c.save();c.clip();
 const tint=c.createRadialGradient(W*.9,0,20,W*.9,0,W*.5);tint.addColorStop(0,hexA(m.c,.10));tint.addColorStop(1,"rgba(255,255,255,0)");
 c.fillStyle=tint;c.fillRect(0,0,W,H);
 c.fillStyle=m.c;c.fillRect(P,P,W-P*2,5);
 /* 顶 */
 const tx=58,ty=52,lw=46;
 if(logoImg){c.save();rr(c,tx,ty-lw/2,lw,lw,13);c.fillStyle="#fff";c.strokeStyle="#e7eaf2";c.lineWidth=1;c.stroke();rr(c,tx,ty-lw/2,lw,lw,13);c.clip();c.drawImage(logoImg,tx,ty-lw/2,lw,lw);c.restore();}
 c.fillStyle="#141e38";c.font="800 26px 'Segoe UI','PingFang SC',sans-serif";c.fillText("APRSlocus",tx+lw+16,ty+2);
 c.fillStyle="#8b95a9";c.font="600 13px 'Segoe UI','PingFang SC',sans-serif";
 c.save();c.letterSpacing="1.6px";c.fillText(TX[lang].mem||"F I R S T   M E M B E R",tx+lw+16,ty+27);c.restore();
 /* 右上 */
 const cap=(TX[lang].early||"APRSlocus 早期成员");
 c.font="700 14.5px 'PingFang SC','Segoe UI',sans-serif";const capW=c.measureText(cap).width;
 c.save();rr(c,W-58-capW-30,24,capW+30,36,18);c.fillStyle=hexA(m.c,.15);c.fill();
 c.fillStyle=m.c;c.textAlign="center";c.fillText(cap,W-58-capW/2-15,48);c.textAlign="left";c.restore();
 c.fillStyle="#8b95a9";c.font="700 14px Consolas,monospace";c.textAlign="right";
 c.fillText(m.num.toString().padStart(2,"0")+" / "+MEMBERS.length.toString().padStart(2,"0"),W-58,100);c.textAlign="left";
 c.fillStyle="#eef1f7";c.fillRect(58,132,W-116,1);
 /* 中 */
 const cx=58,cy0=278;
 c.save();c.letterSpacing="2.5px";c.fillStyle="#8b95a9";c.font="700 15px 'Segoe UI','PingFang SC',sans-serif";
 c.fillText((TX[lang].early||"").toUpperCase(),cx,cy0-102);c.restore();
 c.fillStyle="#0d1426";c.font="800 132px 'SF Mono','Consolas',ui-monospace,monospace";c.fillText(m.call,cx,cy0+2);
 c.fillStyle=m.c;c.fillRect(cx,cy0+56,72,4);
 c.fillStyle="#182238";c.font="700 30px 'PingFang SC','Segoe UI',sans-serif";c.fillText(m.who[lang]||m.who.zh,cx,cy0+128);
 const role=m.role[lang]||m.role.zh;
 c.font="600 17px 'PingFang SC','Segoe UI',sans-serif";const rw=c.measureText(role).width;
 c.save();rr(c,cx,cy0+150,rw+30,34,17);c.fillStyle="#f2f4f9";c.fill();c.restore();
 c.fillStyle="#4c5770";c.fillText(role,cx+15,cy0+172);
 /* 底 */
 c.fillStyle="#eef0f6";c.fillRect(58,H-82,W-116,1);
 c.fillStyle="#9aa4b8";c.font="700 18px Consolas,monospace";c.fillText("# "+m.num.toString().padStart(2,"0"),58,H-44);
 c.fillStyle="#7c8699";c.font="500 17px 'PingFang SC','Segoe UI',sans-serif";c.textAlign="right";
 c.fillText(TX[lang].foot,W-58,H-44);c.textAlign="left";
 c.restore();
 rr(c,P,P,W-P*2,H-P*2,R);c.lineWidth=1;c.strokeStyle="#e4e8f1";c.stroke();
}
function updateProfile(){const m=MEMBERS[idx];
 document.getElementById("pCall").textContent=m.call;
 document.getElementById("pWho").textContent=m.who[lang]||m.who.zh;
 document.getElementById("pNum").textContent="# "+m.num.toString().padStart(2,"0")+" / "+MEMBERS.length;
 document.getElementById("pRole").textContent=m.role[lang]||m.role.zh;
 document.getElementById("pBrief").textContent=m.brief[lang]||m.brief.zh;
 document.getElementById("pWords").textContent="“"+(m.words[lang]||m.words.zh)+"”";}
let logoImg=undefined;{const t=new Image();t.onload=()=>{logoImg=t;draw();};t.src=LOGO;}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1600);}
function exportPng(){const a=document.createElement("a");a.download="APRSlocus-FIRST-MEMBER-"+MEMBERS[idx].call+".png";a.href=cv.toDataURL("image/png");a.click();toast(TX[lang].saved);}
lang=detect();
const qc=new URLSearchParams(location.search).get("call");
const fi=MEMBERS.findIndex(x=>x.call.toUpperCase()===(qc||"").toUpperCase());if(fi>=0)idx=fi;
sync();updateProfile();
</script>
</body>
</html>
