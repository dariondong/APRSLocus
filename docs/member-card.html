const I18N={
 "zh":{hint:"APRSlocus 早期成员会员卡 · 点击下方切换成员 · 可导出高清图片保存分享",
   export:"导出图片",next:"下一位成员",f1:"FIRST MEMBER · 电波无限，感谢同行",saved:"✓ 图片已导出",member:"会员",since:"致电波里的同行"},
 "zh-TW":{hint:"APRSlocus 早期成員會員卡 · 點擊下方切換成員 · 可匯出高清圖片儲存分享",
   export:"匯出圖片",next:"下一位成員",f1:"FIRST MEMBER · 電波無限，感謝同行",saved:"✓ 圖片已匯出",member:"會員",since:"致電波裡的同行"},
 "en":{hint:"APRSlocus early-member membership card · switch below · export hi-res image",
   export:"Export image",next:"Next member",f1:"FIRST MEMBER · endless waves, thank you friends",saved:"✓ Image exported",member:"MEMBER",since:"To friends on the air"}
};

const W=1200,H=720,SF=1.6; // 逻辑分辨率 + 导出放大
let lang="zh"; let idx=0; let cur=0;
const cv=document.getElementById("cv");
let logoImg=null;
(function(){const t=new Image();t.onload=()=>{logoImg=t;draw();};t.src=LOGO;})();

function detectLang(){const q=new URLSearchParams(location.search);
 if(q.get("lang"))return q.get("lang");
 const n=(navigator.language||"zh-CN").toLowerCase();
 return n.startsWith("zh-tw")||n.startsWith("zh-hk")?"zh-TW":n.startsWith("en")?"en":"zh";}
function setLang(l){lang=l;const u=new URL(location);if(l!=="zh")u.searchParams.set("lang",l);else u.searchParams.delete("lang");history.replaceState(null,"",u);syncText();draw();mark();}
function setCard(i){idx=((i%MEMBERS.length)+MEMBERS.length)%MEMBERS.length;
 const u=new URL(location);u.searchParams.set("call",MEMBERS[idx].call);if(lang!=="zh")u.searchParams.set("lang",lang);else u.searchParams.delete("lang");history.replaceState(null,"",u);draw();mark();}
function nextCard(){setCard(idx+1);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function syncText(){document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(I18N[lang][k]!=null)e.textContent=I18N[lang][k];});
 document.getElementById("hint").textContent=I18N[lang].hint;
 document.documentElement.lang=lang==="zh"?"zh-CN":(lang==="zh-TW"?"zh-Hant":"en");
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));}
function mark(){document.getElementById("pager").innerHTML="";
 MEMBERS.forEach((m,i)=>{const b=document.createElement("button");b.textContent=m.call;
  if(i===idx)b.classList.add("on");b.onclick=()=>setCard(i);document.getElementById("pager").appendChild(b);});}

function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function draw(){
 const m=MEMBERS[idx];
 cv.width=W*SF;cv.height=H*SF;
 const c=cv.getContext("2d");c.scale(SF,SF);
 c.clearRect(0,0,W,H);
 /* 外描边 */
 rr(c,1.5,1.5,W-3,H-3,24);c.lineWidth=2;c.strokeStyle="rgba(212,175,90,.55)";c.stroke();
 /* 底色：深蓝渐变 + 光斑 */
 const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#0a1735");bg.addColorStop(.5,"#0c1f46");bg.addColorStop(1,"#071027");
 c.fillStyle=bg;c.fillRect(2,2,W-4,H-4);
 const r1=c.createRadialGradient(W*.82,H*.12,40,W*.82,H*.12,W*.5);
 r1.addColorStop(0,"rgba(56,189,248,.28)");r1.addColorStop(1,"transparent");
 c.fillStyle=r1;c.fillRect(0,0,W,H);
 const r2=c.createRadialGradient(W*.12,H*.9,30,W*.12,H*.9,W*.42);
 r2.addColorStop(0,"rgba(212,175,90,.22)");r2.addColorStop(1,"transparent");
 c.fillStyle=r2;c.fillRect(0,0,W,H);
 /* 细波线装饰（底部） */
 c.save();c.globalAlpha=.12;c.strokeStyle="#9fd8ff";c.lineWidth=1.5;
 for(let k=0;k<4;k++){c.beginPath();
   for(let x=40;x<W-40;x+=4){const y=H-(46+k*18)+Math.sin((x+k*80)/46)*4;
     k===0?c.moveTo(x,y):c.lineTo(x,y);}c.stroke();}c.restore();
 /* 顶部徽标行 */
 const tx=64,ty=62;
 if(logoImg){c.save();
   rr(c,tx,ty-34,40,40,11);c.fillStyle="#ffffff";c.fill();
   rr(c,tx,ty-34,40,40,11);c.clip();
   c.drawImage(logoImg,tx,ty-34,40,40);c.restore();}
 c.fillStyle="#fff";c.font="800 26px 'Segoe UI','PingFang SC',sans-serif";
 c.fillText("APRSlocus",tx+54,ty-6);
 c.fillStyle="#d4af5a";c.font="700 12px 'Segoe UI',sans-serif";
 c.fillText("F I R S T   M E M B E R",tx+54,ty+12);
 /* 右上：电台图标符号 */
 c.save();c.globalAlpha=.85;c.strokeStyle="#d4af5a";c.lineWidth=2;
 c.beginPath();c.arc(W-130,58,22,0,Math.PI*2);c.stroke();
 c.beginPath();c.arc(W-130,58,13,0,Math.PI*2);c.stroke();
 c.fillStyle="#d4af5a";c.beginPath();c.arc(W-130,58,5,0,Math.PI*2);c.fill();c.restore();
 c.fillStyle="rgba(255,255,255,.75)";c.font="700 13px 'Segoe UI',sans-serif";c.textAlign="right";
 c.fillText("HAM RADIO · APRS",W-94,63);c.textAlign="left";

 /* 中部：芯片 + 呼号 */
 const cy=H*.52;
 /* 芯片 */
 c.save();
 const chip=c.createLinearGradient(72,cy-52,120,cy-4);chip.addColorStop(0,"#e7c873");chip.addColorStop(1,"#a97c2c");
 c.fillStyle=chip;c.fill();
 c.strokeStyle="rgba(90,60,10,.35)";c.lineWidth=1;c.stroke();
 c.beginPath();c.moveTo(103,cy-52);c.lineTo(103,cy-4);c.stroke();
 c.beginPath();c.moveTo(72,cy-30);c.lineTo(134,cy-30);c.stroke();
 c.beginPath();c.moveTo(72,cy-16);c.lineTo(134,cy-16);c.stroke();
 c.restore();
 /* 联系人样式符号 */
 c.save();c.strokeStyle="rgba(255,255,255,.5)";c.lineWidth=2;
 [[0,.35],[1.4,.6],[2.8,.85]].forEach(([a,b])=>{c.beginPath();c.arc(158,cy-24,9+b*10,-a*Math.PI,a*Math.PI);c.stroke();});
 c.restore();

 /* 呼号大字 */
 c.fillStyle="#fff";
 c.font="900 96px 'Consolas','Menlo',ui-monospace,monospace";
 const callW=c.measureText(m.call).width;
 c.fillText(m.call,72,cy+44);
 /* 名称 */
 c.fillStyle="rgba(255,255,255,.88)";c.font="600 26px 'PingFang SC','Segoe UI',sans-serif";
 c.fillText(m.who[lang]||m.who.zh,74,cy+92);
 /* 角色徽章 */
 const role=m.role[lang]||m.role.zh;
 c.font="700 17px 'PingFang SC','Segoe UI',sans-serif";const rw=c.measureText(role).width;
 c.save();const gc=c.createLinearGradient(74,cy+108,74+rw+44,cy+108);gc.addColorStop(0,m.g[0]);gc.addColorStop(1,m.g[1]);
 c.fillStyle=gc;rr(c,74,cy+110,rw+44,36,18);c.fill();c.restore();
 c.fillStyle="#fff";c.textAlign="center";c.fillText(role,96+rw/2,cy+134);c.textAlign="left";

 /* 底部编号 + 寄语 */
 c.fillStyle="rgba(255,255,255,.92)";c.font="800 34px 'Consolas',monospace";
 c.fillText("NO."+m.no,72,H-58);
 c.fillStyle="#d4af5a";c.font="700 16px 'PingFang SC','Segoe UI',sans-serif";
 c.fillText(m.words[lang]||m.words.zh,72,H-28);
 /* 右下标：member 铭牌 */
 const tag=m.tag[lang]||m.tag.zh;
 c.font="700 15px 'PingFang SC',sans-serif";const tw=c.measureText(tag).width;
 c.save();rr(c,W-72-tw-34,H-72,tw+34,30,15);c.strokeStyle="rgba(212,175,90,.7)";c.lineWidth=1.5;c.stroke();c.restore();
 c.fillStyle="#d4af5a";c.textAlign="right";c.fillText(tag,W-86,H-51);c.textAlign="left";
 /* 右下角小字会员 */
 c.fillStyle="rgba(255,255,255,.45)";c.font="600 12px 'Segoe UI',sans-serif";
 c.textAlign="right";c.fillText(I18N[lang].member+" · "+I18N[lang].since,W-86,H-34);c.textAlign="left";
}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1800);}
function exportPng(){const a=document.createElement("a");a.download="APRSlocus-FIRST-MEMBER-"+MEMBERS[idx].call+".png";a.href=cv.toDataURL("image/png");a.click();toast(I18N[lang].saved);}

lang=detectLang();
const q=new URLSearchParams(location.search).get("call");
const fi=MEMBERS.findIndex(x=>x.call.toUpperCase()===(q||"").toUpperCase());if(fi>=0)idx=fi;
mark();syncText();draw();
</script>
