<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%}

    background:

      radial-gradient(700px 500px at 4% 26%, rgba(160,120,50,.10), transparent 55%),

    background-attachment:fixed;
    min-height:100vh;color:#eaf1ff;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:clamp(14px,4vh,40px) 16px;overflow-x:hidden;

  /* 细网格肌理（极淡） */
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;

    background-size:44px 44px}
  /* 卡片下方光面 */
  .ped{position:relative;margin:10px 0 6px}
  .ped::before{content:"";position:absolute;left:8%;right:8%;bottom:-34px;height:80px;

  canvas{display:block;width:min(680px,94vw);height:auto;border-radius:30px;

  /* 底部极简控件 */
  .ui{width:min(680px,94vw);display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:clamp(16px,4vh,30px)}
  .pill{font:inherit;font-size:12.5px;color:#c3d2f2;display:inline-flex;align-items:center;gap:7px;
    background:rgba(255,255,255,.05);border:1px solid rgba(150,180,255,.18);
    border-radius:999px;padding:7px 15px;cursor:pointer;transition:.25s;backdrop-filter:blur(8px);
    text-decoration:none}
  .pill:hover{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(180,205,255,.4)}
  .pill.gold{background:linear-gradient(135deg,#e7c873,#c89b3c);color:#251a04;font-weight:800;border:none;
    box-shadow:0 8px 22px -8px rgba(212,175,90,.6)}
  .pill svg{width:14px;height:14px}
  .pill.sel{background:rgba(230,200,122,.2);color:#f2d98e;border-color:rgba(230,200,122,.5)}
  .langs{position:fixed;top:14px;right:16px;display:flex;gap:5px;z-index:20}
  .langs button{font:inherit;font-size:11.5px;color:#9fb2dd;background:rgba(255,255,255,.04);
    border:1px solid rgba(150,180,255,.14);border-radius:999px;padding:4px 11px;cursor:pointer;transition:.2s}
  .langs button.on{color:#241a04;background:linear-gradient(135deg,#e7c873,#c89b3c);border-color:transparent;font-weight:800}
  .langs button:not(.on):hover{color:#fff}
  .mark{position:fixed;top:12px;left:16px;display:flex;align-items:center;gap:9px;z-index:20;text-decoration:none}
  .mark img{width:34px;height:34px;border-radius:9px;background:#fff;padding:3px;box-shadow:0 8px 20px rgba(2,5,16,.5)}
  .mark b{font-size:15px;letter-spacing:-.02em;color:#eaf1ff;display:block;line-height:1.05}
  .mark span{font-size:9.5px;letter-spacing:3px;color:#d4af5a;font-weight:800}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(90px);
    background:#141e38;border:1px solid rgba(212,175,90,.4);color:#f2e3b6;font-size:13px;
    padding:10px 22px;border-radius:12px;opacity:0;transition:.3s;z-index:99;box-shadow:0 12px 30px rgba(0,0,0,.5)}

let lang="zh",idx=0;const cv=document.getElementById("cv");
function detect(){const q=new URLSearchParams(location.search);if(q.get("lang"))return q.get("lang");
 const n=(navigator.language||"zh-CN").toLowerCase();return n.startsWith("zh-tw")||n.startsWith("zh-hk")?"zh-TW":n.startsWith("en")?"en":"zh";}
function setLang(l){lang=l;const u=new URL(location);if(l!=="zh")u.searchParams.set("lang",l);else u.searchParams.delete("lang");history.replaceState(null,"",u);ui();draw();}
function setCard(i){idx=((i%MEMBERS.length)+MEMBERS.length)%MEMBERS.length;
 const u=new URL(location);u.searchParams.set("call",MEMBERS[idx].call);if(lang!=="zh")u.searchParams.set("lang",lang);else u.searchParams.delete("lang");history.replaceState(null,"",u);ui();draw();}
function nextCard(){setCard(idx+1);}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ui(){document.querySelectorAll("[data-i18n]").forEach(e=>{const k=e.dataset.i18n;if(TX[lang][k]!=null)e.textContent=TX[lang][k];});
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
 const p=document.getElementById("pager");p.innerHTML="";
 MEMBERS.forEach((m,i)=>{const s=document.createElement("span");s.className="pill"+(i===idx?" sel":"");s.textContent=m.call;
  s.style.cursor="pointer";s.onclick=()=>setCard(i);p.appendChild(s);});
 document.documentElement.lang=lang==="zh"?"zh-CN":lang==="zh-TW"?"zh-Hant":"en";}
function draw(){
 const m=MEMBERS[idx];
 cv.width=W*SF;cv.height=H*SF;const c=cv.getContext("2d");c.scale(SF,SF);
 c.clearRect(0,0,W,H);
 const R=26;
 /* —— 卡体 —— */
 rr(c,0,0,W,H,R);c.save();c.clip();
 /* 底色 */
 const bg=c.createLinearGradient(0,0,W,H);bg.addColorStop(0,"#17294f");bg.addColorStop(.32,"#0e1c3b");bg.addColorStop(.75,"#0a142e");bg.addColorStop(1,"#060b1c");
 c.fillStyle=bg;c.fillRect(0,0,W,H);
 /* 斜向柔光（模拟塑料高光）：左上大光 */
 const hl=c.createRadialGradient(W*.16,H*.06,30,W*.16,H*.06,W*.75);
 hl.addColorStop(0,"rgba(210,235,255,.32)");hl.addColorStop(.3,"rgba(150,190,255,.10)");hl.addColorStop(1,"transparent");
 c.fillStyle=hl;c.fillRect(0,0,W,H);
 /* 右上气氛色（成员 accent）低透明 */
 const ar=c.createRadialGradient(W*.86,H*.22,20,W*.86,H*.22,W*.6);
 ar.addColorStop(0,hexA(m.accent,.30));ar.addColorStop(.55,hexA(m.accent,.05));ar.addColorStop(1,"transparent");
 c.fillStyle=ar;c.fillRect(0,0,W,H);
 /* 顶部边缘高光（实体卡棱边） */
 const etop=c.createLinearGradient(0,0,0,26);etop.addColorStop(0,"rgba(255,255,255,.55)");etop.addColorStop(.5,"rgba(255,255,255,.10)");etop.addColorStop(1,"transparent");
 c.fillStyle=etop;c.fillRect(0,0,W,26);
 /* 细暗纹：极淡斜线 */
 c.save();c.globalAlpha=.05;c.strokeStyle="#000";c.lineWidth=1;
 for(let x=-H;x<W+H;x+=22){c.beginPath();c.moveTo(x,0);c.lineTo(x+H,H);c.stroke();}c.restore();
 /* 底部斜向深色渐变增加纵深 */
 const eb=c.createLinearGradient(0,H-120,0,H);eb.addColorStop(0,"transparent");eb.addColorStop(1,"rgba(0,0,0,.34)");
 c.fillStyle=eb;c.fillRect(0,H-120,W,120);

 /* 点状颗粒（金属磨砂） */
 c.save();c.globalAlpha=.05;c.fillStyle="#fff";
 for(let k=0;k<520;k++){c.fillRect((Math.random()*W)|0,(Math.random()*H)|0,1,1);}c.restore();

 /* 左下：金色圆标（雷达/73） */
 const ox=76,oy=H-92,Ro=46;
 c.save();
 const ring=c.createLinearGradient(ox-Ro,oy-Ro,ox+Ro,oy+Ro);ring.addColorStop(0,"#e9cd80");ring.addColorStop(1,"#9c7626");
 c.fillStyle=ring;c.beginPath();c.arc(ox,oy,Ro,0,Math.PI*2);c.fill();
 c.strokeStyle="rgba(60,40,5,.55)";c.lineWidth=1;c.stroke();
 /* 圆内：深蓝底 + 信号 */
 c.beginPath();c.arc(ox,oy,Ro-7,0,Math.PI*2);c.fillStyle="#0a142e";c.fill();
 c.strokeStyle="rgba(233,205,128,.9)";c.lineWidth=1.6;
 c.beginPath();c.arc(ox,oy,14,0,Math.PI*2);c.stroke();
 c.beginPath();c.arc(ox,oy,22,-.3,Math.PI*2+.3);c.stroke();
 c.fillStyle="#e9cd80";c.font="800 15px 'Segoe UI',sans-serif";c.textAlign="center";c.textBaseline="middle";
 c.fillText("73",ox,oy+1);c.textBaseline="alphabetic";c.textAlign="left";
 c.restore();
 /* 左下：编号 + 发行行 */
 c.fillStyle="#e6c87a";c.font="800 30px 'Consolas',ui-monospace,monospace";
 c.fillText(m.no,152,H-86);
 c.fillStyle="rgba(230,200,122,.55)";c.font="600 13px 'PingFang SC','Segoe UI',sans-serif";
 c.fillText((m.who[lang]||m.who.zh)+" · "+(m.role[lang]||m.role.zh),152,H-62);

 /* 中部主呼号（凸印：多层） */
 const callX=76, callY=260;
 const mono="'Consolas','Menlo',ui-monospace,monospace";
 c.font="900 118px "+mono;
 c.textBaseline="alphabetic";
 /* 阴影层 */
 c.fillStyle="rgba(0,0,0,.55)";c.fillText(m.call,callX+3,callY+5);
 /* 主字金渐变 */
 const gc=c.createLinearGradient(callX,callY-110,callX+300,callY);
 gc.addColorStop(0,"#fdf3d0");gc.addColorStop(.45,"#e7c87c");gc.addColorStop(1,"#a97c2e");
 c.fillStyle=gc;c.fillText(m.call,callX,callY);
 /* 高光：顶部细浅色 */
 c.save();c.globalAlpha=.55;c.strokeStyle="#fff6dd";c.lineWidth=2;
 c.strokeText(m.call,callX,callY);c.restore();
 /* 底部暗线加重浮雕 */
 c.save();c.globalAlpha=.4;c.strokeStyle="#241703";c.lineWidth=4;
 c.strokeText(m.call,callX,callY);c.restore();

 /* 成员 accent 细分隔线 */
 c.fillStyle=hexA(m.accent,.8);
 c.fillRect(callX,callY+16,118,3);

 /* 右上 logo 章 */
 const lx=W-96,ly=86,LR=40;
 if(logoImg){c.save();
  rr(c,lx-LR,ly-LR,LR*2,LR*2,LR);c.fillStyle="#ffffff";c.fill();
  rr(c,lx-LR,ly-LR,LR*2,LR*2,LR);c.clip();
  c.drawImage(logoImg,lx-LR,ly-LR,LR*2,LR*2);c.restore();}
 /* 右上文字 */
 c.textAlign="right";c.fillStyle="#fff";c.font="800 25px 'Segoe UI','PingFang SC',sans-serif";
 c.fillText("APRSlocus",W-88,80);
 c.fillStyle="#d4af5a";c.font="700 12.5px 'Segoe UI',sans-serif";
 c.fillText(TX[lang].mem,W-88,102);c.textAlign="left";
 /* 右侧竖排小呼号（装饰） */
 c.save();c.globalAlpha=.22;c.fillStyle="#fff";c.font="700 15px Consolas,monospace";
 c.translate(W-66,H-100);c.rotate(-Math.PI/2);c.fillText(m.call+" · HAM RADIO · APRS",0,0);c.restore();

 /* 底部中央：品牌寄语 */
 c.textAlign="center";c.fillStyle="rgba(233,205,128,.92)";c.font="600 16px 'PingFang SC','Segoe UI',sans-serif";
 c.fillText(TX[lang].brand,W/2,H-40);c.textAlign="left";

 /* 右下发卡信息（小） */
 c.textAlign="right";c.fillStyle="rgba(220,235,255,.5)";c.font="600 12px 'PingFang SC',sans-serif";
 c.fillText(TX[lang].since+"  ·  EST. 2025",W-78,H-40);
 c.restore();
 /* 外描边 */
 rr(c,.5,.5,W-1,H-1,R);c.strokeStyle="rgba(255,255,255,.35)";c.lineWidth=1;c.stroke();
}
function hexA(hex,a){const n=parseInt(hex.slice(1),16);
 return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),1700);}
function exportPng(){const a=document.createElement("a");
 a.download="APRSlocus-FIRST-MEMBER-"+MEMBERS[idx].call+".png";
 a.href=cv.toDataURL("image/png");a.click();toast(TX[lang].saved);}
lang=detect();
const qc=new URLSearchParams(location.search).get("call");
const fi=MEMBERS.findIndex(x=>x.call.toUpperCase()===(qc||"").toUpperCase());if(fi>=0)idx=fi;
ui();
</script>
</body>
</html>
