<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRSlocus 视频画面（PPT）· 解说台</title>
<meta name="description" content="APRSlocus 视频画面稿：16:9 幻灯片，可直接全屏录制、当视频画面用。">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#f3f6fd">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css?v=5">
<style>
/* ════════════════════════════════════════════════════════════════
   APRSlocus 视频画面 · 16:9 幻灯片（沿用官网毛玻璃风格）
   设计尺寸 1600×900，运行时自动缩放铺满屏幕；F 全屏录制。
   快捷键：← → 翻页 · F 全屏 · T 提词条 · C 界面 · A 自动播放 · 1-9 跳页
   ════════════════════════════════════════════════════════════════ */

/* ── 舞台 ── */
body { overflow: hidden; height: 100vh; margin: 0; }
.stage { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; cursor: none; }
.stage.show-ui { cursor: default; }

/* 缩放容器：固定 1600×900 画布 */
.fit { position: relative; width: 1600px; height: 900px; transform-origin: center center; }

/* ── 单页 ── */
.slide {
  position: absolute; inset: 0; padding: 84px 96px 96px;
  display: flex; flex-direction: column; justify-content: center;
  opacity: 0; visibility: hidden;
  transition: opacity .5s var(--ease);
}
.slide.on { opacity: 1; visibility: visible; }
.slide.head { justify-content: center; }
/* 内容包一层，超框时自动缩一点（见脚本里的 fitBody） */
.body { width: 100%; }

/* 页脚细线：品牌 + 页码 */
.foot {
  position: absolute; left: 96px; right: 96px; bottom: 40px; z-index: 3;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 17px; color: var(--text-faint); letter-spacing: .3px;
}
.foot b { color: var(--text-dim); font-weight: 800; }
.foot .pg { font-variant-numeric: tabular-nums; }

/* ── 通用文字块 ── */
.kicker {
  display: inline-flex; align-items: center; gap: 12px;
  font-size: 19px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
  color: var(--cyan);
}
.kicker::before { content: ""; width: 42px; height: 3px; border-radius: 3px; background: var(--grad); }
.h1 { font-size: 78px; font-weight: 900; letter-spacing: -.03em; line-height: 1.14; margin: 20px 0 0; }
.h1.sm { font-size: 62px; }
.h2 { font-size: 54px; font-weight: 900; letter-spacing: -.025em; line-height: 1.2; margin: 16px 0 0; }
.lead { font-size: 28px; color: var(--text-dim); line-height: 1.7; margin: 22px 0 0; max-width: 1180px; }
.small { font-size: 21px; color: var(--text-faint); line-height: 1.7; }
.big-line { font-size: 104px; font-weight: 900; letter-spacing: -.035em; line-height: 1.12; }
.hl { color: var(--cyan); }
.grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mono { font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace; }

/* 玻璃卡片：与官网 .card 同一配方 */
.gcards { display: grid; gap: 24px; margin-top: 44px; }
.gcards.n2 { grid-template-columns: repeat(2, 1fr); }
.gcards.n3 { grid-template-columns: repeat(3, 1fr); }
.gcards.n4 { grid-template-columns: repeat(4, 1fr); }
.gcard {
  position: relative; padding: 34px 32px; border-radius: var(--radius);
  background: rgba(255, 255, 255, .8); border: 1px solid var(--line);
  box-shadow: 0 14px 38px rgba(45, 70, 120, .12);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  overflow: hidden;
}
.gcard::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(320px circle at 22% 0%, rgba(56, 189, 248, .16), transparent 62%);
}
.gcard .ic {
  width: 66px; height: 66px; border-radius: 18px; display: grid; place-items: center;
  margin-bottom: 20px; box-shadow: 0 12px 26px rgba(45, 70, 120, .2);
}
.gcard .ic svg { width: 33px; height: 33px; fill: #fff; }
.gcard svg:not(.ic svg) { width: 22px; height: 22px; }
.gcard .ic img { width: 40px; height: 40px; }
.gcard h3 { font-size: 30px; font-weight: 800; margin-bottom: 12px; position: relative; }
.gcard p { font-size: 21px; color: var(--text-dim); line-height: 1.7; position: relative; }
.gcard p b, .gcard li b { color: var(--text); }
.gcard.cc { padding: 30px 28px; }
.gcard.cc h3 { font-size: 26px; }
.gcard.cc p { font-size: 19px; }
.gcard ul { list-style: none; position: relative; }
.gcard ul li { font-size: 20px; color: var(--text-dim); padding-left: 20px; position: relative; line-height: 1.6; }
.gcard ul li + li { margin-top: 9px; }
.gcard ul li::before {
  content: ""; position: absolute; left: 2px; top: .62em; width: 8px; height: 8px;
  border-radius: 50%; background: var(--cyan); box-shadow: 0 0 0 3px rgba(56, 189, 248, .18);
}
.tags { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; position: relative; }
.tags span {
  font-size: 18px; color: #0369a1; background: rgba(255, 255, 255, .62);
  border: 1px solid rgba(56, 189, 248, .3); padding: 7px 16px; border-radius: 999px;
}
.tags.plain span { color: var(--text-dim); border-color: var(--line); }

/* 芯片 / 徽章 */
.chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.chip {
  display: inline-flex; align-items: center; gap: 12px; font-size: 21px; font-weight: 700;
  background: rgba(255, 255, 255, .58); border: 1px solid var(--line);
  padding: 12px 22px; border-radius: 999px; box-shadow: 0 8px 20px rgba(45, 70, 120, .08);
}
.chip img { width: 30px; height: 30px; }
.chip svg { width: 26px; height: 26px; flex: 0 0 auto; fill: var(--cyan); }
.chip .dot { width: 11px; height: 11px; border-radius: 50%; }
.d-g { background: var(--green); } .d-y { background: var(--amber); } .d-o { background: #94a0b2; }
.d-b { background: var(--blue); } .d-c { background: var(--cyan); }

/* 大数字 / 关键量 */
.stats { display: flex; gap: 64px; margin-top: 44px; }
.stat b { display: block; font-size: 58px; font-weight: 900; letter-spacing: -.03em; line-height: 1; }
.stat span { display: block; font-size: 19px; color: var(--text-faint); margin-top: 10px; }

/* 代码块（原始报文） */
.report {
  margin-top: 40px; padding: 34px 38px; border-radius: var(--radius);
  background: rgba(15, 23, 42, .92); border: 1px solid rgba(255, 255, 255, .12);
  box-shadow: 0 18px 44px rgba(15, 23, 42, .3);
}
.report code {
  font-family: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
  font-size: 27px; line-height: 1.75; color: #e2e8f0; background: none; padding: 0; display: block;
  word-break: break-all;
}
.report code em { font-style: normal; color: #7dd3fc; font-weight: 700; }
.report code s { text-decoration: none; color: #86efac; }
.report code i { font-style: normal; color: #fcd34d; }

/* ── 链路图 ── */
.chain { display: flex; align-items: stretch; gap: 0; margin-top: 56px; }
.node {
  flex: 1; text-align: center; padding: 30px 14px 26px; border-radius: var(--radius);
  background: var(--glass); border: 1px solid var(--line);
  box-shadow: 0 12px 32px rgba(45, 70, 120, .1);
  backdrop-filter: blur(14px);
}
.node .nic {
  width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 24px; display: grid; place-items: center;
  background: var(--grad); box-shadow: 0 12px 28px rgba(2, 132, 199, .3);
}
.node .nic img { width: 52px; height: 52px; }
.node .nic i { font-size: 36px; color: #fff; }
.node b { display: block; font-size: 25px; font-weight: 800; }
.node span { display: block; font-size: 18px; color: var(--text-faint); margin-top: 8px; line-height: 1.5; }
.node.wide { flex: 1.25; }
.link {
  align-self: center; width: 74px; height: 4px; border-radius: 3px; margin: 0 6px;
  background-image: linear-gradient(90deg, var(--cyan) 50%, rgba(56, 189, 248, .18) 50%);
  background-size: 18px 4px; animation: flow .9s linear infinite; flex: 0 0 auto;
}
@keyframes flow { to { background-position: 18px 0; } }

/* ── 地图示意（用真实 APRS 台站符号） ── */
.mapwrap { display: grid; grid-template-columns: 1.55fr 1fr; gap: 34px; margin-top: 40px; align-items: stretch; }
.mapmock {
  position: relative; height: 424px; border-radius: var(--radius); overflow: hidden;
  background: linear-gradient(160deg, #eef4fb, #e3ecf7);
  border: 1px solid var(--line); box-shadow: 0 18px 44px rgba(45, 70, 120, .14);
}
.mapmock::before {
  content: ""; position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(120, 150, 200, .16) 1px, transparent 1px),
    linear-gradient(90deg, rgba(120, 150, 200, .16) 1px, transparent 1px);
  background-size: 62px 62px;
}
.mapmock::after {
  content: ""; position: absolute; left: -10%; top: 40%; width: 120%; height: 120px;
  background: linear-gradient(90deg, rgba(56, 189, 248, .18), rgba(37, 99, 235, .1));
  filter: blur(2px); transform: rotate(-16deg); border-radius: 40px;
}
.pt { position: absolute; z-index: 2; display: flex; align-items: center; gap: 10px; }
.pt img { width: 54px; height: 54px; filter: drop-shadow(0 6px 12px rgba(15, 23, 42, .28)); }
.pt .c {
  font-family: ui-monospace, Consolas, monospace; font-size: 19px; font-weight: 700; color: #0f172a;
  background: rgba(255, 255, 255, .9); padding: 3px 10px; border-radius: 8px;
  box-shadow: 0 4px 12px rgba(45, 70, 120, .16); white-space: nowrap;
}
.pt::before {
  content: ""; position: absolute; left: 20px; top: 20px; width: 14px; height: 14px; border-radius: 50%;
  border: 2.5px solid var(--green); animation: pulse 2s ease-out infinite;
}
.pt.p2::before { border-color: var(--amber); animation-delay: .5s; }
.pt.p3::before { border-color: #94a0b2; animation-delay: 1s; }
.trail { position: absolute; z-index: 1; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(2, 132, 199, .1), rgba(2, 132, 199, .7)); }
.self { position: absolute; z-index: 2; left: 44%; top: 52%; }
.self img { width: 62px; height: 62px; }
.self::after {
  content: ""; position: absolute; inset: -16px; border-radius: 50%;
  border: 2px dashed rgba(2, 132, 199, .45); animation: spin 9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.legend { display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.legend .row { display: flex; align-items: center; gap: 16px; font-size: 23px; }
.legend .row img { width: 46px; height: 46px; }
.legend .row .t { color: var(--text-dim); }
.legend .row b { font-weight: 800; }

/* ── 聊天气泡 ── */
.chat { display: flex; flex-direction: column; gap: 18px; margin-top: 38px; }
.bub {
  max-width: 760px; padding: 20px 26px; border-radius: 20px; font-size: 24px;
  background: rgba(255, 255, 255, .72); border: 1px solid var(--line); align-self: flex-start;
  box-shadow: 0 10px 26px rgba(45, 70, 120, .1);
}
.bub.me { align-self: flex-end; background: var(--grad); color: #fff; border-color: transparent; }
.bub .meta { display: block; font-size: 16px; opacity: .72; margin-bottom: 6px; font-weight: 700; }
.bub .ack { font-size: 17px; margin-left: 10px; opacity: .85; }

/* ── 呼号大字 ── */
.callbig {
  font-family: ui-monospace, Consolas, monospace; font-size: 150px; font-weight: 800;
  letter-spacing: .02em; line-height: 1;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 16px 36px rgba(2, 132, 199, .22));
}

/* ── 鸣谢名单 ── */
.tname { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 22px; }
.tname span {
  font-family: ui-monospace, Consolas, monospace; font-size: 22px; font-weight: 700; color: var(--text);
  background: rgba(255, 255, 255, .62); border: 1px solid var(--line);
  padding: 11px 20px; border-radius: 14px; box-shadow: 0 8px 20px rgba(45, 70, 120, .08);
}
.tname span em { font-style: normal; color: var(--text-faint); font-weight: 500; margin-left: 10px; font-family: inherit; font-size: 17px; }

/* ── 片尾二维码 ── */
.qrbox {
  width: 340px; height: 340px; padding: 18px; border-radius: 24px; background: #fff;
  border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(45, 70, 120, .18);
}
.qrbox img { width: 100%; height: 100%; image-rendering: pixelated; }

/* ── 进入动画（每页元素依次浮起） ── */
.an { opacity: 0; }
.slide.on .an { animation: riseIn .72s var(--ease) both; animation-delay: calc(var(--i, 0) * .1s); }
@keyframes riseIn { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
.slide.on .an.zoom { animation: zoomIn .8s var(--ease) both; animation-delay: calc(var(--i, 0) * .1s); }
@keyframes zoomIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
.pulse { animation: pulse 1.8s ease-out infinite; }

/* ── 界面（顶栏 / 底栏 / 提词条），2.6 秒无操作自动隐藏 ── */
.ui {
  position: fixed; z-index: 60; opacity: 0; pointer-events: none;
  transition: opacity .3s var(--ease), transform .3s var(--ease);
}
.stage.show-ui .ui { opacity: 1; pointer-events: auto; }
.topbar {
  inset: 0 0 auto 0; display: flex; align-items: center; gap: 16px;
  padding: 14px 22px; transform: translateY(-10px);
  background: linear-gradient(180deg, rgba(243, 246, 253, .92), rgba(243, 246, 253, 0));
  backdrop-filter: blur(8px);
}
.stage.show-ui .topbar { transform: none; }
.topbar .deckbrand { display: flex; align-items: center; gap: 11px; font-weight: 900; font-size: 16px; letter-spacing: -.01em; }
.topbar .deckbrand img { width: 30px; height: 30px; border-radius: 9px; box-shadow: 0 6px 16px rgba(56, 189, 248, .4); }
.topbar .t { font-size: 14px; color: var(--text-faint); }
.topbar .sp { flex: 1; }
.btn2 {
  font: inherit; font-size: 13.5px; font-weight: 700; color: var(--text-dim); cursor: pointer;
  background: rgba(255, 255, 255, .72); border: 1px solid var(--line);
  padding: 9px 14px; border-radius: 11px; transition: .2s var(--ease); white-space: nowrap;
  display: inline-flex; align-items: center; gap: 7px;
}
.btn2 svg { width: 14px; height: 14px; fill: currentColor; }
.btn2:hover { color: var(--text); border-color: rgba(255, 255, 255, .95); box-shadow: 0 8px 20px rgba(45, 70, 120, .12); }
.btn2.on { background: var(--grad); color: #fff; border-color: transparent; }
.btn2 kbd {
  font-family: ui-monospace, monospace; font-size: 11px; padding: 1px 5px; border-radius: 5px;
  background: rgba(15, 23, 42, .07); opacity: .75;
}
.btn2.on kbd { background: rgba(255, 255, 255, .25); }

.hud {
  inset: auto 0 0 0; display: flex; align-items: center; gap: 18px; padding: 14px 22px;
  background: linear-gradient(0deg, rgba(243, 246, 253, .94), rgba(243, 246, 253, 0));
  transform: translateY(10px); backdrop-filter: blur(8px);
}
.stage.show-ui .hud { transform: none; }
.hud .cnt { font-family: ui-monospace, monospace; font-size: 14px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
.hud .cnt b { color: var(--cyan); font-size: 17px; }
.dots { display: flex; gap: 7px; flex-wrap: wrap; max-width: 720px; }
.dots i { width: 26px; height: 6px; border-radius: 3px; background: rgba(120, 150, 200, .28); cursor: pointer; transition: .25s var(--ease); }
.dots i:hover { background: rgba(120, 150, 200, .5); }
.dots i.on { background: var(--grad); box-shadow: 0 0 10px rgba(56, 189, 248, .5); }
.hud .sp { flex: 1; }
.hud .navb { display: flex; gap: 8px; }

/* 提词条（T 开关）：只给自己看，录制前记得关 */
.prompt {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 70; display: none;
  padding: 18px clamp(20px, 4vw, 60px) 22px;
  background: linear-gradient(0deg, rgba(15, 23, 42, .93), rgba(15, 23, 42, .78));
  color: #f1f5f9; backdrop-filter: blur(10px);
}
.prompt.show { display: block; }
.prompt b { display: block; font-size: 12px; letter-spacing: .18em; color: #7dd3fc; margin-bottom: 8px; font-weight: 800; }
.prompt p { font-size: 26px; line-height: 1.6; max-width: 1400px; }
.prompt .pg2 { position: absolute; right: clamp(20px, 4vw, 60px); top: 18px; font-size: 20px; color: #7dd3fc; font-family: ui-monospace, monospace; }

/* 提示条 */
.tip {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 14px); z-index: 80;
  background: rgba(15, 23, 42, .86); color: #fff; font-size: 14px;
  padding: 11px 20px; border-radius: 12px; opacity: 0; pointer-events: none;
  transition: .3s var(--ease); box-shadow: 0 16px 40px rgba(15, 23, 42, .35);
}
.tip.show { opacity: 1; transform: translate(-50%, 0); }

/* 内容超框时的兜底缩放标记（脚本按需加 .shrunk） */
.slide.shrunk .body { transform-origin: center center; }

/* ── 打印 / 导出 PDF：每页一张 16:9 横版 ── */
.print-all { display: none; }
@media print {
  @page { size: A4 landscape; margin: 6mm; }
  html, body { overflow: visible; height: auto; background: #fff; }
  .stage, .ui, .tip, .prompt { display: none !important; }
  .print-all { display: block; }
  .print-all .sheet {
    position: relative; width: 1600px; height: 900px; overflow: hidden;
    page-break-after: always; break-after: page;
    zoom: .64; transform-origin: 0 0;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .print-all .slide { opacity: 1 !important; visibility: visible !important; }
  .print-all .an { opacity: 1 !important; animation: none !important; }
}
/* ── 录制模式（按 R）：画面完全干净，鼠标移动也不弹界面 ── */
body.rec .stage { cursor: none; }
body.rec .ui { opacity: 0 !important; pointer-events: none !important; }
body.rec .prompt, body.rec .tip { display: none !important; }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span>
  </div>
  <div class="fit" id="fit">
    <div class="slide" id="slide"></div>
  </div>
<!-- 顶栏 -->
<header class="ui topbar" id="topbar">
  <span class="deckbrand"><img src="assets/logo.png" alt="APRSlocus">APRSlocus 视频画面</span>
  <span class="t" id="tTitle"></span>
  <span class="sp"></span>
  <button class="btn2" id="bPrompt">提词条 <kbd>T</kbd></button>
  <button class="btn2" id="bAuto">自动播放 <kbd>A</kbd></button>
  <button class="btn2" id="bPrint">导出 PDF <kbd>P</kbd></button>
  <button class="btn2" id="bFull">全屏 <kbd>F</kbd></button>
<button class="btn2" id="bRec">录制模式 <kbd>R</kbd></button>
  <a class="btn2" href="./">官网</a>
</header>

<!-- 底栏 -->
<footer class="ui hud" id="hud">
  <span class="cnt" id="cnt"></span>
  <span class="dots" id="dots"></span>
  <span class="sp"></span>
  <span class="navb">
    <button class="btn2" id="bPrev">← 上一页</button>
    <button class="btn2" id="bNext">下一页 →</button>
  </span>
</footer>

<!-- 提词条（录制旁白时用；录制画面时按 T 关掉） -->
<div class="prompt" id="prompt">
  <span class="pg2" id="pg2"></span>
  <b>旁白 · 照着念</b>
  <p id="narrText"></p>
</div>

<div class="tip" id="tip"></div>
</div>

<!-- ═══════════════════════════════════════════════════════════════
     幻灯片（画面稿）· 01–09
     data-narr = 旁白（按 T 在底部显示，照着念；录制画面时记得关掉）
     ═══════════════════════════════════════════════════════════════ -->

<!-- ── 01 封面 ── -->
<template class="sl" data-narr="大家好，我是 BG7LZQ。这个视频不讲课，就是分享一个我自己做得顺手、也天天在用的 APRS 工具，叫 APRSlocus。">
  <div class="body">
  <div style="display:grid;grid-template-columns:1.4fr 1fr;gap:70px;align-items:center">
    <div>
      <span class="kicker an" style="--i:0">APRS 科普 · 软件分享</span>
      <h1 class="big-line an" style="--i:1;font-size:132px;margin-top:18px"><span class="grad">APRSlocus</span></h1>

<!-- ── 03 APRS 是什么 ── -->
<template class="sl" data-narr="APRS，全称 Automatic Packet Reporting System，自动分组报告系统。简单说，就是让业余电台自动报告自己在哪、速度多少、海拔多高，还能发短消息、传气象数据、发遥测信息。你可以把它理解成业余无线电里的实时位置加短消息网络。">
  <div class="body">
  <div>
    <span class="kicker an" style="--i:0">快速科普</span>
    <h2 class="h2 an" style="--i:1">APRS，让电台自己报位置、传消息</h2>
    <p class="lead an" style="--i:2">
      <span class="mono hl" style="font-size:30px;font-weight:700">APRS</span>
      = Automatic Packet Reporting System · 自动分组报告系统
    </p>
  </div>
  <div class="gcards n2 an" style="--i:3">
    <div class="gcard">
      <div class="ic" style="background:linear-gradient(135deg,#38bdf8,#0284c7)"><svg viewBox="0 0 384 512" aria-hidden="true"><path d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/></svg></div>
      <h3>自动报位置</h3>
      <p>我在哪、速度多少、海拔多高 —— 电台自己发出去，不用手打。</p>
    </div>
    <div class="gcard">
      <div class="ic" style="background:linear-gradient(135deg,#34d399,#059669)"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M64 0C28.7 0 0 28.7 0 64L0 352c0 35.3 28.7 64 64 64l96 0 0 80c0 6.1 3.4 11.6 8.8 14.3s11.9 2.1 16.8-1.5L309.3 416 448 416c35.3 0 64-28.7 64-64l0-288c0-35.3-28.7-64-64-64L64 0z"/></svg></div>

<script>
/* ════════════════════════════════════════════════════════════════
   APRSlocus 视频画面 · 放映器
   —— 页面本身不出现说明书；操作靠快捷键，鼠标动一下界面才出来。
   ════════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  /* ── 取出所有页面（模板） ── */
  var tpls = Array.prototype.slice.call(document.querySelectorAll('template.sl'));
  var SLIDES = tpls
    .filter(function (t) { return t.getAttribute('data-hide') !== 'true'; })
    .map(function (t) {
      var html = t.innerHTML;
      var title = '第 ' + (tpls.indexOf(t) + 1) + ' 页';
      try {
        var doc = new DOMParser().parseFromString(html, 'text/html');
        var h = doc.querySelector('.h1, .h2, .big-line, .callbig');
        if (h) title = h.textContent.replace(/\s+/g, ' ').trim().slice(0, 40);
      } catch (e) { /* 取不到标题不影响放映 */ }
      return { html: html, narr: t.getAttribute('data-narr') || '', title: title };
    });

  var total = SLIDES.length;
  var stage = document.getElementById('stage');
  var fitEl = document.getElementById('fit');
  var slide = document.getElementById('slide');
  var dotsBox = document.getElementById('dots');
  var cnt = document.getElementById('cnt');
  var promptBox = document.getElementById('prompt');
  var narrText = document.getElementById('narrText');
  var pg2 = document.getElementById('pg2');
  var tipBox = document.getElementById('tip');
  var tTitle = document.getElementById('tTitle');
  var i = 0;
  var timer = null, autoTimer = null;

  /* ── 缩放：1600×900 画布铺满窗口 ── */
  function fit() {
    var s = Math.min(window.innerWidth / 1600, window.innerHeight / 900);
    fitEl.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit, { passive: true });
  fit();

  /* ── 提示条 ── */
  var tipT = null;
  function tip(msg, ms) {
    tipBox.textContent = msg;
    tipBox.classList.add('show');
    clearTimeout(tipT);
    tipT = setTimeout(function () { tipBox.classList.remove('show'); }, ms || 1900);
  }

  /* ── 界面自动隐藏（录制时画面干净） ── */
  var uiLock = false;
  function showUI() {
    if (document.body.classList.contains('rec')) return;   /* 录制模式下不弹界面 */
    stage.classList.add('show-ui');
    clearTimeout(timer);
    if (!uiLock) timer = setTimeout(function () { stage.classList.remove('show-ui'); }, 2600);
  }
  function lockUI(on) { uiLock = on; if (on) { clearTimeout(timer); stage.classList.add('show-ui'); } else { showUI(); } }
  document.addEventListener('mousemove', showUI, { passive: true });
  document.getElementById('topbar').addEventListener('pointerenter', function () { lockUI(true); });
  document.getElementById('topbar').addEventListener('pointerleave', function () { lockUI(false); });
  document.getElementById('hud').addEventListener('pointerenter', function () { lockUI(true); });
  document.getElementById('hud').addEventListener('pointerleave', function () { lockUI(false); });

  /* ── 兜底：内容比画布高时，整体缩一点，绝不溢出到画面外 ── */
  var AVAIL = 900 - 84 - 96;             /* 画布高 - 上下内边距 */
  function fitBody(root) {
    var body = root.querySelector('.body');
    if (!body) return;
    body.style.zoom = '';
    var need = body.offsetHeight;
    if (need > AVAIL + 1) {
      body.style.zoom = Math.max(0.68, AVAIL / need).toFixed(3);
      root.classList.add('shrunk');
    } else {
      root.classList.remove('shrunk');
    }
  }

  /* ── 渲染 ── */
  function render(idx, dir) {
    var s = SLIDES[idx];
    slide.classList.remove('on');
    slide.innerHTML = s.html;
    void slide.offsetWidth;              /* 强制重排，让动画重新开始 */
    slide.classList.add('on');
    fitBody(slide);

    var n = ('0' + (idx + 1)).slice(-2), all = ('0' + total).slice(-2);
    cnt.innerHTML = '<b>' + n + '</b> / ' + all;
    tTitle.textContent = s.title;
    narrText.textContent = s.narr;
    pg2.textContent = n + ' / ' + all;
    Array.prototype.forEach.call(dotsBox.children, function (d, k) { d.classList.toggle('on', k === idx); });
    if (location.hash !== '#s' + (idx + 1)) history.replaceState(null, '', '#s' + (idx + 1));
    showUI();
  }

  function go(idx) {
    idx = Math.max(0, Math.min(total - 1, idx));
    if (idx === i && slide.innerHTML) return;
    i = idx;
    render(i);
  }
  function next() { go(i + 1); }
  function prev() { go(i - 1); }

  /* ── 底栏进度点 ── */
  SLIDES.forEach(function (s, k) {
    var d = document.createElement('i');
    d.title = (k + 1) + '. ' + s.title;
    d.addEventListener('click', function () { go(k); showUI(); });
    dotsBox.appendChild(d);
  });

  /* ── 提词条（旁白） ── */
  function togglePrompt(force) {
    var on = (typeof force === 'boolean') ? force : !promptBox.classList.contains('show');
    promptBox.classList.toggle('show', on);
    document.getElementById('bPrompt').classList.toggle('on', on);
    tip(on ? '提词条已开：录制画面时记得按 T 关掉' : '提词条已关', 2600);
  }

  /* ── 自动播放 ── */
  var AUTO_MS = 8000;
  function toggleAuto(force) {
    var on = (typeof force === 'boolean') ? force : !autoTimer;
    clearInterval(autoTimer); autoTimer = null;
    document.getElementById('bAuto').classList.toggle('on', on);
    if (on) {
      autoTimer = setInterval(function () {
        if (i >= total - 1) { toggleAuto(false); tip('已到最后一页'); return; }
        next();
      }, AUTO_MS);
      tip('自动播放：每 ' + (AUTO_MS / 1000) + ' 秒翻一页（再按 A 停止）', 2600);
    } else {
      tip('已停止自动播放');
    }
  }

  /* ── 全屏 ── */
  function toggleFull() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(function () { tip('浏览器不允许全屏，请按 F11'); });
    }
  }

  /* ── 录制模式（R）：一键全屏 + 隐藏全部界面 + 隐藏提词，画面完全干净 ──
     为什么要它：录屏时鼠标一动就去「点一下」翻页，界面和鼠标指针都会进画面；
     进了录制模式后，界面不再随鼠标弹出、提词条也隐藏，只剩幻灯片本身。 */
  function toggleRec(force) {
    var on = (typeof force === 'boolean') ? force : !document.body.classList.contains('rec');
    document.body.classList.toggle('rec', on);
    var b = document.getElementById('bRec'); if (b) b.classList.toggle('on', on);
    if (on) {
      clearTimeout(timer);
      stage.classList.remove('show-ui');
      togglePrompt(false);          /* 提词条也关掉（录制画面不该出现旁白） */
      tipBox.classList.remove('show');
      if (!document.fullscreenElement) toggleFull();
    } else {
      showUI();
      tip('已退出录制模式');
    }
  }

  /* ── 打印：把所有页面摊开，一次导出 PDF ── */
  var printBox = null;
  function buildPrint() {
    if (printBox) return;
    printBox = document.createElement('div');
    printBox.className = 'print-all';
    printBox.innerHTML = SLIDES.map(function (s) {
      return '<div class="sheet"><div class="slide on">' + s.html + '</div></div>';
    }).join('');
    document.body.appendChild(printBox);
    Array.prototype.forEach.call(printBox.querySelectorAll('.slide'), fitBody);
  }
  window.addEventListener('beforeprint', buildPrint);
  window.addEventListener('afterprint', function () {
    if (printBox) { printBox.remove(); printBox = null; }
  });

  /* ── 按钮 ── */
  document.getElementById('bNext').addEventListener('click', next);
  document.getElementById('bPrev').addEventListener('click', prev);
  document.getElementById('bPrompt').addEventListener('click', function () { togglePrompt(); });
  document.getElementById('bAuto').addEventListener('click', function () { toggleAuto(); });
  document.getElementById('bFull').addEventListener('click', toggleFull);
  document.getElementById('bRec').addEventListener('click', function () { toggleRec(); });
  document.getElementById('bPrint').addEventListener('click', function () { window.print(); });

  /* ── 点击翻页（录制时最省事）：点右半边下一页，左半边上一页 ── */
  stage.addEventListener('click', function (e) {
    if (e.target.closest('.ui') || e.target.closest('.prompt')) return;
    (e.clientX < window.innerWidth * 0.25) ? prev() : next();
  });

  /* ── 键盘 ── */
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); return; }
    if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); prev(); return; }
    if (k === 'Home') { e.preventDefault(); go(0); return; }
    if (k === 'End') { e.preventDefault(); go(total - 1); return; }
    if (k === 'Escape') { if (document.body.classList.contains('rec')) { toggleRec(false); } else { togglePrompt(false); } return; }
    if (k === 'f' || k === 'F') { toggleFull(); return; }
    if (k === 't' || k === 'T') { togglePrompt(); return; }
    if (k === 'a' || k === 'A') { toggleAuto(); return; }
    if (k === 'p' || k === 'P') { window.print(); return; }
    if (k === 'c' || k === 'C') {                     /* 显示 / 隐藏界面（临时用鼠标时） */
      uiLock = !uiLock; showUI(); tip(uiLock ? '界面已固定显示' : '界面自动隐藏已恢复');
      return;
    }
    if (k === 'r' || k === 'R') { toggleRec(); return; }   /* 录制模式：全屏 + 画面全干净 */
    if (k === '[') { AUTO_MS = Math.max(3000, AUTO_MS - 1000); tip('自动播放：每 ' + (AUTO_MS / 1000) + ' 秒'); if (autoTimer) toggleAuto(true); return; }
    if (k === ']') { AUTO_MS = Math.min(30000, AUTO_MS + 1000); tip('自动播放：每 ' + (AUTO_MS / 1000) + ' 秒'); if (autoTimer) toggleAuto(true); return; }
    if (/^[1-9]$/.test(k)) { go(parseInt(k, 10) - 1); }
  });

  /* ── 浏览器前进 / 后退也跟着翻页 ── */
  window.addEventListener('hashchange', function () {
    var m = /^#s([0-9]+)$/.exec(location.hash);
    if (m) go(parseInt(m[1], 10) - 1);
  });

  /* ── 起始页：#s3 直达某一页 ── */
  var m0 = /^#s([0-9]+)$/.exec(location.hash);
  i = m0 ? Math.max(0, Math.min(total - 1, parseInt(m0[1], 10) - 1)) : 0;
  render(i);
  setTimeout(function () {
    tip('← → 翻页 · R 录制模式 · F 全屏 · T 提词条 · A 自动播放 · P 导出 PDF', 5600);
  }, 500);
})();
</script>
