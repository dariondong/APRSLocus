<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRSlocus 视频脚本 · 沉浸式解说台</title>
<meta name="description" content="APRSlocus 视频脚本的沉浸式演示页：逐页讲解画面、字幕、旁白与备注，支持提词模式，方便录制解说。">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#05070d">
<link rel="icon" type="image/png" href="assets/favicon.png">
<style>
/* ════════════════════════════════════════════════════════════════
   APRSlocus 视频脚本 · 沉浸式解说台（自包含单页，无外部依赖）
   用法：← → 翻页；P 提词；O 目录；H 快捷键；F 全屏
   01. 变量与基础   02. 背景   03. 顶栏 / 底栏 HUD
   04. 幻灯片骨架   05. 卡片（画面 / 字幕 / 旁白 / 备注）
   06. 封面与列表页 07. 提词模式   08. 目录浮层 / 帮助
   09. 响应式       10. 打印
   ════════════════════════════════════════════════════════════════ */

/* ── 01. 变量与基础 ── */
:root {
  --bg: #05070d;
  --panel: rgba(255, 255, 255, .045);
  --panel-2: rgba(255, 255, 255, .075);
  --line: rgba(125, 211, 252, .16);
  --line-strong: rgba(125, 211, 252, .34);
  --text: #e9effb;
  --dim: #a3b2cc;
  --faint: #6d7c98;
  --cyan: #38bdf8;
  --cyan-soft: #7dd3fc;
  --blue: #2563eb;
  --green: #34d399;
  --amber: #fbbf24;
  --grad: linear-gradient(120deg, #7dd3fc, #38bdf8);
  --radius: 18px;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --sans: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", Consolas, "Courier New", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  color: var(--text);
  background: var(--bg);
  line-height: 1.7;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
::selection { background: rgba(56, 189, 248, .35); }

/* ── 02. 背景 ── */
.bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg::before {
  content: ""; position: absolute; inset: -10%;
  background-image:
    linear-gradient(rgba(125, 211, 252, .045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125, 211, 252, .045) 1px, transparent 1px);
  background-size: 46px 46px, 46px 46px;
  mask-image: radial-gradient(120% 90% at 50% 10%, #000 20%, transparent 78%);
  -webkit-mask-image: radial-gradient(120% 90% at 50% 10%, #000 20%, transparent 78%);
}
.orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; }
.o1 { width: 46vw; height: 46vw; top: -16vw; right: -10vw; background: rgba(56, 189, 248, .22); animation: float 22s var(--ease) infinite alternate; }
.o2 { width: 38vw; height: 38vw; bottom: -14vw; left: -8vw; background: rgba(37, 99, 235, .20); animation: float 26s var(--ease) infinite alternate-reverse; }
.o3 { width: 26vw; height: 26vw; bottom: 12vh; right: 18vw; background: rgba(52, 211, 153, .12); animation: float 30s var(--ease) infinite alternate; }
@keyframes float { from { transform: translate3d(0, 0, 0) scale(1); } to { transform: translate3d(-4vw, 5vh, 0) scale(1.12); } }

/* ── 03. 顶栏 / 底栏 HUD ── */
.deck { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 14px clamp(14px, 3vw, 34px);
  border-bottom: 1px solid rgba(125, 211, 252, .08);
  background: linear-gradient(180deg, rgba(5, 7, 13, .86), rgba(5, 7, 13, 0));
  backdrop-filter: blur(8px);
  transition: opacity .35s var(--ease), transform .35s var(--ease);
}
.home {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 12px; border-radius: 11px; text-decoration: none;
  color: var(--dim); font-size: 13.5px;
  border: 1px solid transparent; transition: .25s var(--ease);
}
.home:hover { color: var(--text); background: var(--panel); border-color: var(--line); }
.home i { font-style: normal; font-size: 15px; }
.deck-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.deck-title strong { font-size: 15px; letter-spacing: .4px; white-space: nowrap; }
.deck-title span { font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.tools { display: flex; align-items: center; gap: 6px; }
.tool {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 11px; border-radius: 11px; cursor: pointer;
  background: transparent; border: 1px solid var(--line);
  color: var(--dim); font-family: inherit; font-size: 12.5px;
  transition: .22s var(--ease);
}
.tool:hover { color: var(--text); background: var(--panel); border-color: var(--line-strong); }
.tool.on { color: #04121d; background: var(--grad); border-color: transparent; font-weight: 700; }
.tool kbd {
  font-family: var(--mono); font-size: 10.5px; padding: 1px 5px; border-radius: 5px;
  background: rgba(255, 255, 255, .08); color: inherit; opacity: .8;
}
.tool.on kbd { background: rgba(4, 18, 29, .18); }

.progress { height: 2px; background: rgba(125, 211, 252, .1); }
.progress > i { display: block; height: 100%; width: 0; background: var(--grad); box-shadow: 0 0 14px rgba(56, 189, 248, .7); transition: width .45s var(--ease); }

.hud {
  display: flex; align-items: center; gap: 16px;
  padding: 12px clamp(14px, 3vw, 34px);
  border-top: 1px solid rgba(125, 211, 252, .08);
  background: linear-gradient(0deg, rgba(5, 7, 13, .9), rgba(5, 7, 13, 0));
  transition: opacity .35s var(--ease), transform .35s var(--ease);
}
.counter { font-family: var(--mono); font-size: 12.5px; color: var(--dim); letter-spacing: 1px; }
.counter b { color: var(--cyan-soft); font-size: 15px; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot {
  width: 22px; height: 5px; border-radius: 3px; cursor: pointer; border: 0; padding: 0;
  background: rgba(125, 211, 252, .18); transition: .25s var(--ease);
}
.dot:hover { background: rgba(125, 211, 252, .45); }
.dot.on { background: var(--grad); box-shadow: 0 0 12px rgba(56, 189, 248, .6); }
.hud .spacer { flex: 1; }
.navbtns { display: flex; gap: 8px; }
.navbtn {
  width: 38px; height: 34px; border-radius: 11px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  font-size: 15px; line-height: 1; transition: .22s var(--ease);
}
.navbtn:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line-strong); transform: translateY(-1px); }
.navbtn:disabled { opacity: .3; cursor: default; }
.hint { font-size: 12px; color: var(--faint); white-space: nowrap; }

/* ── 04. 幻灯片骨架 ── */
.stage { flex: 1; position: relative; overflow: hidden; }
.slide {
  position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain;
  padding: clamp(18px, 3.4vh, 40px) clamp(16px, 3.6vw, 56px) clamp(24px, 4vh, 44px);
  display: flex; flex-direction: column; gap: clamp(14px, 2.2vh, 24px);
  opacity: 0; visibility: hidden; transform: translateY(18px) scale(.995);
  transition: opacity .42s var(--ease), transform .42s var(--ease), visibility .42s;
}
.slide.on { opacity: 1; visibility: visible; transform: none; }
.slide.head { justify-content: center; }
.slide::-webkit-scrollbar { width: 8px; }
.slide::-webkit-scrollbar-thumb { background: rgba(125, 211, 252, .18); border-radius: 8px; }

.slide-head { display: flex; align-items: flex-start; gap: clamp(12px, 1.6vw, 22px); }
.num {
  font-family: var(--mono); font-size: clamp(26px, 3.6vw, 44px); font-weight: 800; line-height: 1;
  background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  opacity: .85; padding-top: 3px;
}
.kicker { font-size: 12px; letter-spacing: 3px; color: var(--cyan-soft); text-transform: uppercase; }
.slide-head h2 { font-size: clamp(21px, 2.6vw, 34px); line-height: 1.25; letter-spacing: .3px; }
.slide-head .tag {
  display: inline-block; margin-top: 8px; font-size: 12px; color: var(--amber);
  border: 1px dashed rgba(251, 191, 36, .45); border-radius: 999px; padding: 2px 10px;
}

.body-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.22fr); gap: clamp(12px, 1.5vw, 20px); align-items: start; }
.col { display: flex; flex-direction: column; gap: clamp(12px, 1.5vw, 18px); min-width: 0; }

/* ── 05. 卡片 ── */
.card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: clamp(14px, 1.5vw, 20px) clamp(15px, 1.6vw, 22px);
  backdrop-filter: blur(6px);
  animation: rise .5s var(--ease) both; animation-delay: var(--d, 0s);
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.card h3 {
  display: flex; align-items: center; gap: 8px;
  font-size: 12.5px; letter-spacing: 2px; color: var(--dim); font-weight: 700; margin-bottom: 10px;
}
.card h3::before { content: ""; width: 14px; height: 2px; border-radius: 2px; background: var(--grad); }
.card p { font-size: clamp(14px, 1.12vw, 16px); color: #cfd9ec; }
.card--visual { border-left: 2px solid rgba(125, 211, 252, .5); }
.card--visual p { color: var(--dim); }
.card--caption { border-left: 2px solid rgba(52, 211, 153, .55); }
.card--caption ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.card--caption li {
  position: relative; padding-left: 20px; font-size: clamp(14.5px, 1.16vw, 17px); color: #dfe8f8;
}
.card--caption li::before {
  content: ""; position: absolute; left: 4px; top: .62em; width: 7px; height: 7px; border-radius: 50%;
  background: var(--green); box-shadow: 0 0 10px rgba(52, 211, 153, .8);
}
.card--caption .music { margin-top: 11px; font-size: 13px; color: var(--faint); }
.card--narr { border-color: var(--line-strong); background: linear-gradient(160deg, rgba(56, 189, 248, .1), rgba(37, 99, 235, .04) 60%); }
.card--narr h3 { color: var(--cyan-soft); }
.narr-text { font-size: clamp(17px, 1.75vw, 25px); line-height: 1.85; color: #f2f7ff; letter-spacing: .2px; }
.card--narr.todo { border-style: dashed; border-color: rgba(251, 191, 36, .45); }
.card--narr.todo .narr-text { color: var(--amber); }
.card--notes { background: rgba(255, 255, 255, .025); }
.card--notes p { color: var(--faint); font-size: clamp(13px, 1vw, 14.5px); }
.hl { color: var(--cyan-soft); font-weight: 700; }
.todo { color: var(--amber); font-weight: 700; }

/* ── 06. 封面与列表页 ── */
.cover { max-width: 1000px; margin: auto; text-align: left; }
.cover .badge {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: 2.4px;
  color: var(--cyan-soft); border: 1px solid var(--line-strong); border-radius: 999px; padding: 5px 14px;
}
.cover .badge::before {
  content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 0 0 rgba(52, 211, 153, .7); animation: ping 1.9s ease-out infinite;
}
@keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(52, 211, 153, 0); } 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); } }
.cover h1 { font-size: clamp(30px, 5.4vw, 62px); line-height: 1.15; margin: 18px 0 12px; letter-spacing: .5px; }
.cover h1 em { font-style: normal; background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cover .sub { color: var(--dim); font-size: clamp(14px, 1.35vw, 18px); max-width: 760px; }
.cover .meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: clamp(20px, 3.4vh, 34px); }
.cover .meta div { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 13px 15px; }
.cover .meta b { display: block; font-size: 12px; letter-spacing: 1.6px; color: var(--faint); margin-bottom: 5px; font-weight: 700; }
.cover .meta span { font-size: 14.5px; color: #d7e1f3; }
.cover .start { margin-top: clamp(18px, 3vh, 28px); color: var(--faint); font-size: 13px; }
.cover .start kbd { font-family: var(--mono); font-size: 11.5px; padding: 2px 7px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); }

.list-wrap { max-width: 1080px; margin: auto; width: 100%; }
.list { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 10px; margin-top: 6px; }
.list li {
  display: flex; gap: 12px; align-items: flex-start;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 13px 16px;
  font-size: clamp(14px, 1.1vw, 16px); color: #d9e3f4;
  animation: rise .5s var(--ease) both; animation-delay: var(--d, 0s);
}
.list li i { font-style: normal; font-family: var(--mono); font-size: 12px; color: var(--cyan-soft); padding-top: 4px; }

/* ── 07. 提词模式 ── */
.deck.prompt .topbar, .deck.prompt .hud, .deck.prompt .col--a, .deck.prompt .card--notes, .deck.prompt .progress { opacity: 0; pointer-events: none; }
.deck.prompt .body-grid { grid-template-columns: minmax(0, 1fr); max-width: 1120px; margin: 0 auto; }
.deck.prompt .slide-head { max-width: 1120px; margin: 0 auto; width: 100%; }
.deck.prompt .card--narr { background: transparent; border-color: transparent; padding: 0; }
.deck.prompt .card--narr h3 { opacity: .45; }
.deck.prompt .narr-text { font-size: clamp(24px, 2.9vw, 44px); line-height: 1.75; }
.deck.prompt .narr-text .hl { color: #a5e8ff; }
.deck.prompt .col, .deck.prompt .body-grid { animation: none; }
.deck.prompt .slide { padding-top: clamp(24px, 6vh, 70px); }

/* ── 08. 目录浮层 / 帮助 ── */
.overlay {
  position: fixed; inset: 0; z-index: 50; display: none;
  background: rgba(3, 5, 10, .82); backdrop-filter: blur(10px);
  padding: clamp(16px, 5vh, 60px) clamp(16px, 5vw, 70px); overflow-y: auto;
}
.overlay.open { display: block; animation: fade .25s var(--ease); }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.overlay h2 { font-size: 18px; margin-bottom: 6px; }
.overlay .ov-sub { color: var(--faint); font-size: 13px; margin-bottom: 20px; }
.ov-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.ov-item {
  text-align: left; cursor: pointer; font-family: inherit;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px 15px; color: var(--text); transition: .22s var(--ease);
}
.ov-item:hover { border-color: var(--line-strong); background: var(--panel-2); transform: translateY(-2px); }
.ov-item b { display: block; font-family: var(--mono); font-size: 12px; color: var(--cyan-soft); }
.ov-item span { font-size: 14.5px; }
.ov-item.on { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan) inset; }
.help-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; max-width: 1100px; }
.help-list div { display: flex; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px; font-size: 14px; color: var(--dim); }
.help-list kbd { font-family: var(--mono); font-size: 11.5px; padding: 3px 8px; border-radius: 7px; background: var(--panel-2); border: 1px solid var(--line); color: var(--text); white-space: nowrap; }
.ov-close { position: fixed; top: 18px; right: 22px; z-index: 51; }
.toast {
  position: fixed; left: 50%; bottom: 74px; transform: translate(-50%, 12px);
  background: rgba(10, 18, 32, .94); border: 1px solid var(--line-strong); color: var(--text);
  padding: 9px 16px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none;
  transition: .3s var(--ease); z-index: 60;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ── 09. 响应式 ── */
@media (max-width: 900px) {
  .body-grid { grid-template-columns: minmax(0, 1fr); }
  .deck-title span { display: none; }
  .hint { display: none; }
}
@media (max-width: 620px) {
  .tools .tool span, .tool kbd { display: none; }
  .hud { gap: 10px; }
  .dots { display: none; }
  .narr-text { font-size: clamp(16px, 4.4vw, 20px); }
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ── 10. 打印（Ctrl+P 导出全部页，当脚本文档用） ── */
@media print {
  body { overflow: visible; background: #fff; color: #111; }
  .bg, .topbar, .hud, .progress, .overlay, .toast { display: none !important; }
  .stage { overflow: visible; height: auto; }
  .slide { position: static; opacity: 1 !important; visibility: visible !important; transform: none !important; page-break-after: always; border-bottom: 1px solid #ccc; padding: 0 0 16px; }
  .card { border: 1px solid #ccc; background: #fff; }
  .card p, .card--caption li, .narr-text { color: #111; }
  .deck-title strong, .slide-head h2 { color: #111; }
  .num { color: #333; -webkit-text-fill-color: #333; }
  body.has-print .deck { display: none !important; }
  .print-all { display: block !important; }
  .print-all .num { color: #333; -webkit-text-fill-color: #333; }
  .print-all .card { page-break-inside: avoid; }
}
.print-all { display: none; }
</style>
</head>
<body>
<div class="deck" id="deck">

  <div class="bg" aria-hidden="true">
    <span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span>
  </div>

  <header class="topbar" id="topbar">
    <a class="home" href="./" title="返回官网首页"><i>←</i> 官网</a>
    <div class="deck-title">
      <strong>APRSlocus 视频脚本</strong>
      <span>亲切详细版 · 无时间码</span>
    </div>
    <span class="spacer"></span>
    <div class="tools">
      <button class="tool" id="btnIndex" title="目录（O）">目录 <kbd>O</kbd></button>
      <button class="tool" id="btnPrompt" title="提词模式（P）">提词 <kbd>P</kbd></button>
      <button class="tool" id="btnCopy" title="复制本页旁白">复制旁白</button>
      <button class="tool" id="btnHelp" title="快捷键（H）">? <kbd>H</kbd></button>
    </div>
  </header>
  <div class="progress"><i id="bar"></i></div>

  <main class="stage" id="stage"></main>

  <footer class="hud">
    <span class="counter" id="counter"></span>
    <div class="dots" id="dots"></div>
    <span class="spacer"></span>
    <span class="hint">← → 翻页 · P 提词 · O 目录 · F 全屏</span>
    <div class="navbtns">
      <button class="navbtn" id="btnPrev" aria-label="上一页">↑</button>
      <button class="navbtn" id="btnNext" aria-label="下一页">↓</button>
    </div>
  </footer>
</div>

<!-- 目录 -->
<div class="overlay" id="ovIndex" role="dialog" aria-label="目录">
  <button class="tool ov-close" id="ovIndexClose">关闭 Esc</button>
  <h2>目录</h2>
  <p class="ov-sub">点击任意一页跳转，或用 ← → 逐页讲。</p>
  <div class="ov-grid" id="ovGrid"></div>
</div>

<!-- 快捷键 -->
<div class="overlay" id="ovHelp" role="dialog" aria-label="快捷键">
  <button class="tool ov-close" id="ovHelpClose">关闭 Esc</button>
  <h2>快捷键</h2>
  <p class="ov-sub">录制时建议按 F 全屏，再按 P 进提词模式。</p>
  <div class="help-list">
    <div><kbd>→</kbd><kbd>↓</kbd><kbd>空格</kbd> 下一页</div>
    <div><kbd>←</kbd><kbd>↑</kbd> 上一页</div>
    <div><kbd>Home</kbd><kbd>End</kbd> 首页 / 末页</div>
    <div><kbd>1</kbd>…<kbd>9</kbd> 跳到第 N 页</div>
    <div><kbd>P</kbd> 提词模式（大字旁白）</div>
    <div><kbd>O</kbd> 目录浮层</div>
    <div><kbd>F</kbd> 浏览器全屏</div>
    <div><kbd>C</kbd> 复制本页旁白</div>
    <div><kbd>Esc</kbd> 关闭浮层 / 退出提词</div>
    <div><kbd>滚轮 / 滑动</kbd> 页内滚动，不翻页</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ── 内容：视频脚本（亲切详细版 · 无时间码 · 去掉 FMO） ── */

  var deck = document.getElementById('deck');
  var stage = document.getElementById('stage');

  var ovIndex = document.getElementById('ovIndex');

  var i = 0, total = SLIDES.length;

  /* 转义 + 高亮：呼号 / 频率 / 【待补充】 */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function hl(s) {
    return esc(s)
      .replace(/(【[^】]*】)/g, '<span class="todo">$1</span>')
      .replace(/\b((?:BG|BI|BH|BD|BA|BY)[0-9][A-Z]{1,3})\b/g, '<b class="hl">$1</b>')
      .replace(/([0-9]+\.[0-9]+\s?MHz)/g, '<b class="hl">$1</b>')
      .replace(/\b(APRS-IS|TNC|Flutter|GPL-3\.0|Android|Windows|GPL)\b/g, '<b class="hl">$1</b>');
  }

  /* 把一页渲染成 HTML 字符串（屏幕与打印共用） */
  function slideHTML(s, idx) {
    var n = ('0' + (idx + 1)).slice(-2);
    var html = '';

    if (s.kind === 'cover') {
      html =
        '<article class="slide head">' +
          '<div class="cover">' +
            '<span class="badge">' + esc(s.kicker) + '</span>' +
            '<h1>APRSlocus <em>视频脚本</em></h1>' +
            '<p class="sub">' + esc(s.sub) + '</p>' +
            '<div class="meta">' + s.meta.map(function (m) {
              return '<div><b>' + esc(m[0]) + '</b><span>' + esc(m[1]) + '</span></div>';
            }).join('') + '</div>' +
            '<p class="start">按 <kbd>→</kbd> 开始 / 按 <kbd>O</kbd> 看目录 / 按 <kbd>P</kbd> 进提词模式</p>' +
          '</div>' +
        '</article>';
    } else if (s.kind === 'list') {
      html =
        '<article class="slide head">' +
          '<div class="list-wrap">' +
            '<div class="slide-head" style="margin-bottom:14px">' +
              '<span class="num">' + n + '</span>' +
              '<div><p class="kicker">' + esc(s.kicker) + '</p><h2>' + esc(s.title) + '</h2></div>' +
            '</div>' +
            '<ul class="list">' + s.items.map(function (t, k) {
              return '<li style="--d:' + (k * .04) + 's"><i>' + ('0' + (k + 1)).slice(-2) + '</i><span>' + hl(t) + '</span></li>';
            }).join('') + '</ul>' +
          '</div>' +
        '</article>';
    } else {
      var narrCls = 'card card--narr' + (s.narrTodo ? ' todo' : '');
      html =
        '<article class="slide">' +
          '<div class="slide-head">' +
            '<span class="num">' + n + '</span>' +
            '<div>' +
              '<p class="kicker">' + esc(s.kicker) + '</p>' +
              '<h2>' + esc(s.title) + '</h2>' +
              (s.tag ? '<span class="tag">' + esc(s.tag) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="body-grid">' +
            '<div class="col col--a">' +
              '<section class="card card--visual" style="--d:.02s"><h3>画面</h3><p>' + hl(s.visual) + '</p></section>' +
              '<section class="card card--caption" style="--d:.08s"><h3>' + esc(s.captionTitle || '字幕') + '</h3><ul>' +
                s.caption.map(function (c) { return '<li>' + hl(c) + '</li>'; }).join('') +
              '</ul>' + (s.music ? '<p class="music">音乐：' + hl(s.music) + '</p>' : '') + '</section>' +
            '</div>' +
            '<div class="col col--b">' +
              '<section class="' + narrCls + '" style="--d:.14s"><h3>旁白</h3><p class="narr-text">' + hl(s.narr) + '</p></section>' +
              '<section class="card card--notes" style="--d:.2s"><h3>备注</h3><p>' + hl(s.note) + '</p></section>' +
            '</div>' +
          '</div>' +
        '</article>';
    }
    return html;
  }

  function render(idx) {
    var n = ('0' + (idx + 1)).slice(-2);
    stage.innerHTML = slideHTML(SLIDES[idx], idx);
    requestAnimationFrame(function () {
      var el = stage.firstChild;
      if (el) el.classList.add('on');
    });

    bar.style.width = ((idx + 1) / total * 100) + '%';
    counter.innerHTML = '<b>' + n + '</b> / ' + ('0' + total).slice(-2);
    Array.prototype.forEach.call(dotsBox.children, function (d, k) {
      d.classList.toggle('on', k === idx);
    });
    document.getElementById('btnPrev').disabled = (idx === 0);
    document.getElementById('btnNext').disabled = (idx === total - 1);
    if (location.hash !== '#s' + (idx + 1)) {
      history.replaceState(null, '', '#s' + (idx + 1));
    }
  }

  function go(idx) {
    idx = Math.max(0, Math.min(total - 1, idx));
    if (idx === i && stage.firstChild) return;
    i = idx;
    render(i);
  }
  function next() { go(i + 1); }
  function prev() { go(i - 1); }

  /* 底栏进度点 */
  SLIDES.forEach(function (s, k) {
    var b = document.createElement('button');
    b.className = 'dot';
    b.title = (k + 1) + '. ' + (s.title || s.kicker);
    b.setAttribute('aria-label', b.title);
    b.addEventListener('click', function () { go(k); });
    dotsBox.appendChild(b);
  });

  /* 目录浮层 */
  var ovGrid = document.getElementById('ovGrid');
  SLIDES.forEach(function (s, k) {
    var b = document.createElement('button');
    b.className = 'ov-item';
    b.innerHTML = '<b>' + ('0' + (k + 1)).slice(-2) + '</b><span>' + esc(s.title || '封面') + '</span>';
    b.addEventListener('click', function () { closeOverlays(); go(k); });
    ovGrid.appendChild(b);
  });

  function refreshIndex() {
    Array.prototype.forEach.call(ovGrid.children, function (el, k) { el.classList.toggle('on', k === i); });
  }

  function openOverlay(which) {
    closeOverlays();
    which.classList.add('open');
    if (which === ovIndex) refreshIndex();
  }
  function closeOverlays() {
    ovIndex.classList.remove('open');
    ovHelp.classList.remove('open');
  }

  /* 提示条 */
  var toastTimer = null;
  function toast(msg) {
    toastBox.textContent = msg;
    toastBox.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastBox.classList.remove('show'); }, 1800);
  }

  /* 提词模式 */
  function togglePrompt(force) {
    var on = (typeof force === 'boolean') ? force : !deck.classList.contains('prompt');
    deck.classList.toggle('prompt', on);
    document.getElementById('btnPrompt').classList.toggle('on', on);
    return on;
  }

  /* 全屏 */
  function toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(function () { toast('浏览器不允许全屏，请按 F11'); }); }
  }

  /* 复制本页旁白 */
  function copyNarr() {
    var s = SLIDES[i];
    var txt = s.kind === 'list' ? (s.title + '\n' + s.items.map(function (t, k) { return (k + 1) + '. ' + t; }).join('\n'))
      : (s.title + (s.narr ? '\n\n' + s.narr : '') + (s.note ? '\n\n备注：' + s.note : ''));
    function done() { toast('本页已复制到剪贴板'); }
    function fail() {
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，请手动选择'); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done).catch(fail);
    } else { fail(); }
  }

  /* 事件绑定 */
  document.getElementById('btnPrev').addEventListener('click', prev);
  document.getElementById('btnNext').addEventListener('click', next);
  document.getElementById('btnIndex').addEventListener('click', function () { openOverlay(ovIndex); });
  document.getElementById('btnHelp').addEventListener('click', function () { openOverlay(ovHelp); });
  document.getElementById('btnCopy').addEventListener('click', copyNarr);
  document.getElementById('btnPrompt').addEventListener('click', function () { toast(togglePrompt() ? '提词模式：只留旁白，字更大' : '已退出提词模式'); });
  document.getElementById('ovIndexClose').addEventListener('click', closeOverlays);
  document.getElementById('ovHelpClose').addEventListener('click', closeOverlays);
  ovIndex.addEventListener('click', function (e) { if (e.target === ovIndex) closeOverlays(); });
  ovHelp.addEventListener('click', function (e) { if (e.target === ovHelp) closeOverlays(); });

  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key;
    var tg = e.target;
    if (tg && tg.tagName === 'BUTTON' && (k === ' ' || k === 'Enter')) return; /* 别抢按钮的键 */
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === ' ' || k === 'PageDown' || k === 'Enter') { e.preventDefault(); next(); return; }
    if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); prev(); return; }
    if (k === 'Home') { e.preventDefault(); go(0); return; }
    if (k === 'End') { e.preventDefault(); go(total - 1); return; }
    if (k === 'Escape') { closeOverlays(); togglePrompt(false); return; }
    if (k === 'p' || k === 'P') { toast(togglePrompt() ? '提词模式：只留旁白，字更大' : '已退出提词模式'); return; }
    if (k === 'o' || k === 'O') { ovIndex.classList.contains('open') ? closeOverlays() : openOverlay(ovIndex); return; }
    if (k === 'h' || k === 'H' || k === '?') { ovHelp.classList.contains('open') ? closeOverlays() : openOverlay(ovHelp); return; }
    if (k === 'f' || k === 'F') { toggleFull(); return; }
    if (k === 'c' || k === 'C') { copyNarr(); return; }
    if (/^[1-9]$/.test(k)) { go(parseInt(k, 10) - 1); }
  });

  /* 触摸滑动 */
  var tx = 0, ty = 0;
  document.addEventListener('touchstart', function (e) {
    tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', function (e) {
    var dx = e.changedTouches[0].clientX - tx;
    var dy = e.changedTouches[0].clientY - ty;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
  }, { passive: true });

  /* 打印 / 导出 PDF：把全部页面铺开，一次打完 */
  var printBox = null;
  window.addEventListener('beforeprint', function () {
    if (printBox) return;
    printBox = document.createElement('div');
    printBox.className = 'print-all';
    printBox.innerHTML = SLIDES.map(function (s, k) { return slideHTML(s, k); }).join('');
    document.body.appendChild(printBox);
    document.body.classList.add('has-print');
  });
  window.addEventListener('afterprint', function () {
    if (printBox) { printBox.remove(); printBox = null; }
    document.body.classList.remove('has-print');
  });

  /* 浏览器前进 / 后退也跟着翻页 */
  window.addEventListener('hashchange', function () {
    var mm = /^#s([0-9]+)$/.exec(location.hash);
    if (mm) { go(parseInt(mm[1], 10) - 1); }
  });

  /* 起始页：#s3 直达某一页 */
  var m = /^#s([0-9]+)$/.exec(location.hash);
  i = m ? Math.max(0, Math.min(total - 1, parseInt(m[1], 10) - 1)) : 0;
  render(i);
})();
</script>
</body>
</html>
