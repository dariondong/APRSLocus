    --ease:cubic-bezier(.22,.8,.24,1);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;

      radial-gradient(1000px 640px at 92% 102%, rgba(16,185,129,.12), transparent 60%),
      linear-gradient(180deg,#f3f6fd 0%,#eaf0fb 100%);

    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(14,165,233,.22)}

  /* 顶部玻璃导航 */

    background:rgba(255,255,255,.6);backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    border-bottom:1px solid var(--line)}

    display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:17px;letter-spacing:-.01em}
  .brand img{width:32px;height:32px;border-radius:9px;box-shadow:0 6px 16px rgba(56,189,248,.35)}
  .brand span{font-weight:500;color:var(--text-dim);font-size:12px}
  .langs{margin-left:auto;display:flex;gap:6px}
  .langs button{background:var(--glass);color:var(--text-dim);border:1px solid var(--line);
    border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.25s var(--ease);
    backdrop-filter:blur(8px)}
  .langs button:hover{color:var(--blue)}
  .langs button.on{color:#fff;background:var(--grad);border-color:transparent;font-weight:700;box-shadow:0 6px 16px rgba(2,132,199,.3)}

  /* 总览 Hero */

  .ov-stamp{display:inline-block;font-size:12.5px;letter-spacing:3px;color:var(--blue);

  .ov-stamp b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  h1.title{font-size:clamp(30px,5.4vw,54px);font-weight:900;letter-spacing:-.02em;line-height:1.2}
  h1.title em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .ov-desc{color:var(--text-dim);max-width:720px;margin:18px auto 0;font-size:16px}
  .ov-wave{margin:30px auto 6px;max-width:640px;opacity:.9}

  /* 总览成员网格 */
  .grid{max-width:1180px;margin:14px auto 60px;padding:0 clamp(16px,4vw,36px);
    display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:18px}
  .mem{position:relative;background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 22px 22px;
    cursor:pointer;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s;
    overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
  .mem::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(360px 200px at 115% -15%,rgba(56,189,248,.22),transparent 60%);opacity:0;transition:.4s}
  .mem:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover);border-color:rgba(56,189,248,.5)}
  .mem:hover::before{opacity:1}
  .av{width:66px;height:66px;border-radius:22px;display:flex;align-items:center;justify-content:center;

  .mem .call{font-size:19px;font-weight:900;letter-spacing:1px}

  .mem .tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--blue);

  .mem .go{margin-top:auto;padding-top:14px;color:var(--text-faint);font-size:12px;
    display:inline-flex;align-items:center;gap:4px;transition:.25s}
  .mem:hover .go{color:var(--blue)}

  .tribute{min-height:calc(100vh - 62px);display:flex;align-items:center;justify-content:center;padding:clamp(18px,5vw,60px) 16px}

  .t-seal{font-size:12px;letter-spacing:4px;color:var(--text-faint);margin-bottom:12px}
  .t-words{font-size:clamp(16px,2.6vw,19px);line-height:2;color:#1c2a45;

  .t-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
  .tbtn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:9px 16px;

  .tbtn.pri:hover{filter:brightness(1.05)}
  .others{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .oth{font-size:11.5px;color:var(--text-faint);border:1px solid var(--line);
    background:rgba(255,255,255,.5);border-radius:999px;padding:3px 11px;cursor:pointer;transition:.2s}
  .oth:hover{color:var(--blue);border-color:rgba(2,132,199,.3)}
  .oth.hl{color:#fff;background:var(--grad);border-color:transparent}

  .foot{max-width:1180px;margin:0 auto;padding:30px 20px 44px;text-align:center;color:var(--text-faint);font-size:13px;line-height:2}
  .foot b{color:var(--text-dim)}
  .foot .fine{opacity:.7;font-size:12px}
  .hidden{display:none!important}
  @media (max-width:560px){ .brand span{display:none} .t-id{width:100%} }
</style>
</head>

let lang=detect();
function detect(){const q=new URLSearchParams(location.search);if(q.get("lang"))return q.get("lang");
 const n=(navigator.language||"zh-CN").toLowerCase();if(n.startsWith("zh-tw")||n.startsWith("zh-hk"))return"zh-TW";if(n.startsWith("en"))return"en";return"zh";}
function pick(m){const g=document.querySelector(".langs [data-lang=\""+lang+"\"]");if(g)g.classList.add("on");}
function apply(){
 document.documentElement.lang=lang==="zh"?"zh-CN":(lang==="zh-TW"?"zh-Hant":"en");
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(I18N[lang][k]!=null)el.textContent=I18N[lang][k];});
 pick();renderTribute();}
function renderGrid(){
 const grid=document.getElementById("grid");grid.innerHTML="";
 MEMBERS.forEach((m,i)=>{
  const e=document.createElement("div");e.className="mem reveal-card";e.tabIndex=0;
  const letter=(m.call.replace(/[0-9-]/g,"")[0]||"A").toUpperCase();
  e.innerHTML=`<div class="av" style="background:${m.g[0]}">${letter}</div>
   <div class="call">${m.call}</div><div class="who">${m.who[lang]||m.who.zh}</div>
   <span class="tag">${m.role[lang]||m.role.zh}</span>
   <span class="go">${I18N[lang].viewAll} →</span>`;
  const open=()=>{const u=new URL(location);u.searchParams.set("call",m.call);
   if(lang!=="zh")u.searchParams.set("lang",lang);else u.searchParams.delete("lang");history.pushState(null,"",u);showTribute(m);window.scrollTo({top:0});};
  e.onclick=open;e.onkeydown=(ev)=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();open();}};
  grid.appendChild(e);});
}
function renderTribute(){
 const box=document.getElementById("tribute");
 const cur=new URLSearchParams(location.search).get("call");
 const m=MEMBERS.find(x=>x.call.toUpperCase()===String(cur||"").toUpperCase());
 document.getElementById("overview").classList.toggle("hidden",!!m);
 document.getElementById("grid").classList.toggle("hidden",!!m);
 document.getElementById("tribute").classList.toggle("hidden",!m);
 document.getElementById("foot").classList.toggle("hidden",!!m);
 if(!m){renderGrid();return;}
 const letter=(m.call.replace(/[0-9-]/g,"")[0]||"A").toUpperCase();
 const others=MEMBERS.filter(x=>x!==m);
 box.innerHTML=`<div class="tcard"><div class="tcard-in">
   <div class="t-top">
     <div class="t-av" style="background:${m.g[0]}">${letter}</div>
     <div class="t-id">
       <div class="t-call">${m.call}</div>
       <div class="t-who">${m.who[lang]||m.who.zh}</div>
       <span class="t-role" style="background:${m.g[0]}">${m.role[lang]||m.role.zh}</span>
     </div>
   </div>
   <div class="t-div"></div>
   <div class="t-seal">✧ ${I18N[lang].seal} ✧</div>
   <div class="t-words" style="border-color:${m.g[0]}">${m.words[lang]||m.words.zh}</div>
   <svg class="t-wave" viewBox="0 0 700 46" preserveAspectRatio="none"><defs>
     <linearGradient id="twg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0ea5e9"/><stop offset=".5" stop-color="#0284c7"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
     <path d="M0 26 Q44 6 88 24 T176 22 T264 28 T352 20 T440 26 T528 20 T616 24 T700 18 V46 H0Z" fill="url(#twg)" opacity=".16"/></svg>
   <div class="t-73"><div class="big">73 · ${I18N[lang].still}</div>
     <div class="sub">${m.call} · APRSlocus</div></div>
   <div class="t-actions">
     <a class="tbtn" href="memorial.html${lang==='zh'?'':'?lang='+lang}">${I18N[lang].back}</a>
     <button class="tbtn" onclick="copyLink()">${I18N[lang].share}</button>
   </div>
   <div class="others"><span style="font-size:11px;color:var(--text-faint);align-self:center;padding-right:2px">${I18N[lang].viewAll}:</span>
   ${others.map(o=>`<a class="oth" href="${"memorial.html?call="+o.call+(lang==='zh'?'':'&lang='+lang)}">${o.call}</a>`).join("")}</div>
 </div></div>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function copyLink(){const u=new URL(location);navigator.clipboard.writeText(u.href).then(()=>{const b=document.querySelector(".tbtn:last-child");if(b){const t=b.textContent;b.textContent="✓ "+I18N[lang].copyOK;setTimeout(()=>b.textContent=t,1400);}}).catch(()=>{});}
function setLang(l){lang=l;const u=new URL(location);if(l!=="zh")u.searchParams.set("lang",l);else u.searchParams.delete("lang");history.replaceState(null,"",u);apply();}
apply();
</script>
</body>
