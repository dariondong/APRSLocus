<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy:#0a1733; --navy2:#10203f; --ink:#12213f;
    --dim:#5b6b8c; --faint:#93a3c0;
    --cyan:#22b8e6; --blue:#2f6bff; --gold:#e9c36a;
    --line:rgba(30,50,90,.08);
  }
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;color:var(--ink);
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(1200px 700px at 88% -12%, rgba(56,189,248,.18), transparent 60%),
      radial-gradient(900px 560px at -8% 34%, rgba(47,107,255,.12), transparent 55%),
      radial-gradient(1000px 600px at 96% 104%, rgba(34,211,238,.14), transparent 60%),
      linear-gradient(180deg,#eef3fc,#e7eefb);
    background-attachment:fixed;line-height:1.6;
    display:flex;flex-direction:column;align-items:center;
    padding:clamp(14px,3vw,40px) 16px clamp(30px,5vh,60px);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(34,184,230,.25)}

  /* ── 顶部条（品牌标识 · 右上角 logo+标题）── */
  .topbar{width:100%;max-width:1000px;display:flex;align-items:center;gap:12px;margin-bottom:clamp(16px,3vh,34px)}
  .brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none}
  .brand .lg{width:42px;height:42px;border-radius:13px;background:#fff;box-shadow:0 10px 26px rgba(40,70,140,.22);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .brand .lg img{width:30px;height:30px;border-radius:8px}
  .brand .tt{display:flex;flex-direction:column;line-height:1.2}
  .brand .tt b{font-size:18px;font-weight:900;letter-spacing:-.02em;color:#0c1f46;background:linear-gradient(90deg,#0c2f7a,#0ea5c4);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand .tt span{font-size:11px;font-weight:800;letter-spacing:2.5px;color:var(--gold)}
  .langs{margin-left:auto;display:flex;gap:5px}
  .langs button{font:inherit;font-size:12px;background:rgba(255,255,255,.7);border:1px solid var(--line);
    color:var(--dim);border-radius:999px;padding:5px 12px;cursor:pointer;transition:.25s;backdrop-filter:blur(8px)}
  .langs button:hover{color:var(--blue)}
  .langs button.on{background:#0d2a63;color:#fff;border-color:transparent;font-weight:700}

  /* ── 卡片舞台：每成员独立精美大卡 ── */
  .stage{width:100%;max-width:560px;display:none}
  .stage.show{display:block;animation:in .65s cubic-bezier(.2,.8,.2,1)}
  @keyframes in{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}

  .card{position:relative;border-radius:30px;overflow:hidden;background:#fff;
    box-shadow:0 34px 90px -18px rgba(18,38,80,.35),0 0 0 1px rgba(255,255,255,.6) inset}
  /* 顶部深蓝缎带 */
  .ribbon{position:relative;padding:34px 34px 54px;color:#fff;overflow:hidden;
    background:linear-gradient(150deg,var(--navy2),var(--navy) 55%,#081028)}
  .ribbon::before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;
    background:radial-gradient(circle,rgba(34,184,230,.22),transparent 65%);top:-130px;right:-90px}
  .ribbon::after{content:"";position:absolute;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,rgba(233,195,106,.16),transparent 65%);bottom:-120px;left:-60px}
  .rib-head{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.75);position:relative;z-index:1}
  .rib-head .dot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
  .rib-idx{margin-left:auto;font-weight:800;color:var(--gold);letter-spacing:1px}
  .idwrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;margin-top:26px;text-align:center}
  .call{font-size:clamp(34px,9vw,52px);font-weight:900;letter-spacing:2px;font-family:ui-monospace,Consolas,monospace;line-height:1.05}
  .call .dim{color:rgba(255,255,255,.35);font-size:.55em;font-weight:500;letter-spacing:0}
  .who{margin-top:10px;font-size:16px;font-weight:600;color:#dce6ff}
  .role{margin-top:14px;font-size:12px;font-weight:800;letter-spacing:.5px;color:#fff;
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:999px;
    padding:6px 16px;backdrop-filter:blur(6px)}
  /* 缎带与白体的波浪过渡 */
  .wave{margin:-1px 0 0;display:block;width:100%;height:30px;transform:translateY(1px)}

  /* 卡片主体（寄语 / 装饰 / 编号） */
  .body{position:relative;padding:22px 34px 30px}
  .seal{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:11.5px;letter-spacing:2px}
  .seal::before,.seal::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,#dde5f2)}
  .seal::after{background:linear-gradient(90deg,#dde5f2,transparent)}
  .words{position:relative;margin:20px 2px 6px;font-size:16px;line-height:2;color:#233a5f;text-align:center}
  .words::before{content:"“";display:block;font-size:44px;line-height:.5;color:var(--gold);margin-bottom:6px;font-family:Georgia,serif}
  .fin{margin-top:18px;text-align:center}
  .fin .big{font-size:20px;font-weight:900;letter-spacing:1px;
    background:linear-gradient(90deg,#0c2f7a,#0ea5c4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .fin .sub{color:var(--faint);font-size:12px;margin-top:2px}
  .foot{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
  .btn{font:inherit;font-size:13px;font-weight:700;color:var(--dim);background:#f2f6fd;border:1px solid var(--line);
    border-radius:12px;padding:9px 16px;cursor:pointer;transition:.25s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn:hover{color:var(--blue);border-color:rgba(47,107,255,.35);transform:translateY(-1px)}
  .btn.pri{background:linear-gradient(120deg,#0c2f7a,#0ea5c4);color:#fff;border:none;box-shadow:0 10px 24px -8px rgba(14,165,196,.6)}
  .btn.pri:hover{filter:brightness(1.06);color:#fff}
  .others{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}
  .oth{font:inherit;font-size:11px;color:var(--faint);border:1px solid var(--line);background:#f7f9fd;
    border-radius:999px;padding:3px 10px;cursor:pointer;transition:.2s;text-decoration:none}
  .oth:hover{color:var(--blue);border-color:rgba(47,107,255,.35)}
  .oth.hl{background:var(--navy);color:#fff;border-color:var(--navy)}

  /* ── 总览（无参数时：成员网格小卡）── */
  .idxhead{width:100%;max-width:1000px;margin:6px auto 18px;text-align:center}
  .idxhead .tt2{font-size:clamp(24px,5vw,40px);font-weight:900;letter-spacing:-.02em;color:#0c1f46}
  .idxhead .tt2 em{font-style:normal;background:linear-gradient(90deg,#0c2f7a,#0ea5c4);-webkit-background-clip:text;background-clip:text;color:transparent}
  .idxhead p{color:var(--dim);margin-top:8px;font-size:14.5px}
  .grid{width:100%;max-width:1000px;display:grid;grid-template-columns:repeat(auto-fill,minmax(218px,1fr));gap:16px}
  .mcard{position:relative;background:#fff;border-radius:20px;padding:24px 18px 18px;text-align:center;cursor:pointer;
    box-shadow:0 18px 46px -18px rgba(18,38,80,.28);border:1px solid rgba(255,255,255,.7);
    transition:.3s cubic-bezier(.2,.8,.2,1);overflow:hidden;display:flex;flex-direction:column;align-items:center}

function svgWave(id,stop1,stop2){

}

    </div>
  </div>
  ${svgWave("wv"+m.call.replace(/[^A-Z0-9]/g,""),c1,c2)}
  <div class="body">
    <div class="seal"><span>✧ ${I18N[lang].seal} ✧</span></div>
    <div class="words">${esc(m.words[lang]||m.words.zh)}</div>
    <div class="fin"><div class="big">73 · ${I18N[lang].still}</div>
      <div class="sub">${esc(m.call)} · APRSlocus FIRST MEMBER</div></div>
    <div class="foot">
      <a class="btn" href="memorial.html${lang==='zh'?'':'?lang='+lang}">← ${I18N[lang].back}</a>
      <button class="btn pri" onclick="copyLink()">${I18N[lang].share}</button>
    </div>
    <div class="others">
      ${others.map(o=>`<a class="oth" href="memorial.html?call=${o.call}${lang==='zh'?'':'&lang='+lang}">${o.call}</a>`).join("")}
    </div>
  </div></div>`;
 showId(false);
}
function renderGrid(){
 const g=document.getElementById("grid");g.innerHTML="";
 MEMBERS.forEach(m=>{
  const e=document.createElement("a");e.className="mcard";e.href="memorial.html?call="+m.call+(lang==='zh'?'':'&lang='+lang);
  const letter=(m.call.replace(/[0-9-]/g,"")[0]||"A").toUpperCase();
  e.innerHTML=`<div class="mav" style="background:linear-gradient(140deg,${m.g[0]},${m.g[1]})">${letter}</div>
    <div class="mcall">${esc(m.call)}</div><div class="mwho">${esc(m.who[lang]||m.who.zh)}</div>
    <div class="mrole">${esc(m.role[lang]||m.role.zh)}</div>
    <span class="mgo">${I18N[lang].view} →</span>`;
  g.appendChild(e);});
 showId(true);
}
function apply(){
 document.documentElement.lang=lang==="zh"?"zh-CN":(lang==="zh-TW"?"zh-Hant":"en");
 document.querySelectorAll("[data-i18n]").forEach(el=>{const k=el.dataset.i18n;if(I18N[lang][k]!=null)el.textContent=I18N[lang][k];});
 document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
 const q=new URLSearchParams(location.search).get("call");
 const m=q?MEMBERS.find(x=>x.call.toUpperCase()===String(q).toUpperCase()):null;
 if(m)renderStage(m);else renderGrid();
}
function copyLink(){const u=new URL(location);navigator.clipboard.writeText(u.href).then(()=>{
 const b=document.querySelector(".btn.pri");if(b){const t=b.textContent;b.textContent=I18N[lang].copied;setTimeout(()=>b.textContent=t,1400);}}).catch(()=>{});}
function setLang(l){lang=l;const u=new URL(location);if(l!=="zh")u.searchParams.set("lang",l);else u.searchParams.delete("lang");history.replaceState(null,"",u);apply();}
/* 替换 logo 占位 + 图标 */
(function(){document.querySelectorAll('.lg img').forEach(i=>{if(!i.src||i.src==='')i.src=LOGO;});})();
apply();
</script>
</body>
</html>
