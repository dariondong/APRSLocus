<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>APRSLocus 软件名片 · Software Card</title>
<meta name="description" content="APRSLocus 软件简介名片：供友链 / 项目主页引用，或一键导出 PNG。">
<style>
  :root{
    --ink:#1b2233;
    --sub:#5b6478;
    --line:#e8ebf3;
    --brand:#3b6ef5;
    --brand2:#0ea5b7;
    --card:#ffffff;
    --bg0:#eef2f9;
    --bg1:#e3e9f4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:18px;padding:28px 16px;
    background:radial-gradient(1200px 600px at 50% -10%,var(--bg0),var(--bg1));
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",
                system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",
                "Noto Sans CJK SC",sans-serif;
    color:var(--ink);
  }

  /* ---------- 名片本体（软件简介，供友链引用 / 导出 PNG） ---------- */
  .card{
    position:relative;width:420px;max-width:100%;
    background:var(--card);border-radius:22px;
    box-shadow:0 24px 60px -18px rgba(29,45,90,.28),
               0 6px 18px -8px rgba(29,45,90,.14);
    overflow:hidden;
  }
  .card::before{ /* 顶部渐变条 */
    content:"";position:absolute;inset:0 0 auto 0;height:6px;
    background:linear-gradient(90deg,var(--brand),var(--brand2));
  }

  .hdr{display:flex;align-items:center;gap:13px;padding:26px 26px 16px}
  .blogo{width:46px;height:46px;border-radius:13px;object-fit:cover;flex:0 0 auto;
    box-shadow:0 8px 20px -8px rgba(56,189,248,.7)}
  .hdr-t{display:flex;flex-direction:column;gap:3px;min-width:0}
  .app{font-size:23px;font-weight:800;letter-spacing:.2px;line-height:1.15}
  .sub{font-size:12.5px;color:var(--sub)}
  .tag{
    margin-left:auto;font-size:11.5px;font-weight:700;color:var(--brand);
    background:#eef3fe;border:1px solid #dbe5fd;border-radius:999px;
    padding:5px 11px;white-space:nowrap;
  }

  .hr{height:1px;background:var(--line);margin:0 26px}

  .hero{padding:18px 26px 6px}
  .headline{
    font-size:18px;font-weight:800;letter-spacing:.2px;line-height:1.4;
  }
  .headline span{color:var(--brand)}

  .chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 26px 2px}
  .chip{
    font-size:12.5px;font-weight:700;border-radius:999px;padding:7px 14px;
    line-height:1;border:1px solid var(--line);color:var(--sub);
    background:#f7f9fc;white-space:nowrap;
  }
  .chip.hot{color:var(--brand);background:#eef3fe;border-color:#dbe5fd}

  .about{padding:14px 26px 6px}
  .about p{margin:0;font-size:12.5px;line-height:1.85;color:var(--sub)}

  .plat{display:flex;align-items:baseline;gap:14px;padding:8px 26px 4px}
  .plat .k{font-size:12.5px;color:var(--sub);flex:0 0 auto}
  .plat .v{font-size:12.5px;font-weight:600;color:var(--ink)}

  .foot{
    display:flex;align-items:center;gap:14px;
    margin-top:16px;padding:16px 26px 22px;
    border-top:1px solid var(--line);
  }
  .qr{width:64px;height:64px;border-radius:8px;flex:0 0 auto;background:#fff;
    box-shadow:0 2px 8px -4px rgba(15,40,90,.3)}
  .foot-t{display:flex;flex-direction:column;gap:3px;min-width:0}
  .url{font-size:14px;font-weight:800;color:var(--brand);letter-spacing:.2px}
  .foothint{font-size:12px;color:var(--sub)}

  /* ---------- 操作条 ---------- */
  .bar{width:420px;max-width:100%;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .bar button{
    font:inherit;font-size:14px;font-weight:700;cursor:pointer;
    border:0;border-radius:12px;padding:12px 20px;color:#fff;
    background:linear-gradient(140deg,var(--brand),var(--brand2));
    box-shadow:0 10px 22px -12px rgba(59,110,245,.9);
  }
  .bar button.ghost{
    background:#fff;color:var(--ink);border:1px solid var(--line);
    box-shadow:0 6px 16px -12px rgba(29,45,90,.5);
  }
  .bar button:active{transform:translateY(1px)}
  .lang{margin-left:auto;display:flex;gap:6px}
  .lang button{
    padding:9px 12px;font-size:13px;background:#fff;color:var(--sub);
    border:1px solid var(--line);box-shadow:none;
  }
  .lang button.on{color:var(--brand);border-color:#c9d8fb;background:#eef3fe}
  .hint{margin:0;font-size:12px;color:#8a93a8;text-align:center}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:#1b2233;color:#fff;font-size:13.5px;font-weight:600;
    padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;
    transition:opacity .22s,transform .22s;
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

  <div class="card" id="card">
    <div class="hdr">
      <img class="blogo" id="logo" src="assets/logo.png" alt="APRSLocus">
      <div class="hdr-t">
        <div class="app">APRSLocus</div>
        <div class="sub i18n"
             data-zh="业余无线电 · APRS 客户端"
             data-tw="業餘無線電 · APRS 用戶端"
             data-en="Amateur radio · APRS client">业余无线电 · APRS 客户端</div>
      </div>
      <div class="tag i18n"
           data-zh="软件名片" data-tw="軟體名片" data-en="Software card">软件名片</div>
    </div>

    <div class="hr"></div>

    <div class="hero">
      <div class="headline i18n"
           data-zh="跨平台 <span>APRS</span> 客户端，触达天空"
           data-tw="跨平台 <span>APRS</span> 用戶端，觸達天空"
           data-en="A cross-platform <span>APRS</span> client — touch the sky">跨平台 <span>APRS</span> 客户端，触达天空</div>
    </div>

    <div class="chips">
      <span class="chip hot i18n" data-zh="实时地图与台站" data-tw="即時地圖與台站" data-en="Live map &amp; stations">实时地图与台站</span>
      <span class="chip i18n" data-zh="轨迹与消息" data-tw="軌跡與訊息" data-en="Tracks &amp; messaging">轨迹与消息</span>
      <span class="chip i18n" data-zh="离线地图" data-tw="離線地圖" data-en="Offline maps">离线地图</span>
      <span class="chip i18n" data-zh="多语言界面" data-tw="多語言介面" data-en="6 UI languages">多语言界面</span>
      <span class="chip i18n" data-zh="开源免费" data-tw="開源免費" data-en="Open source">开源免费</span>
    </div>

    <div class="about">
      <p id="desc"
         data-zh="APRSLocus 是一个跨平台、多语言的业余无线电 APRS 客户端：实时台站与轨迹、消息收发、离线地图，支持 Android、Windows、iOS 与 macOS。"
         data-tw="APRSLocus 是一個跨平台、多語言的業餘無線電 APRS 用戶端：即時台站與軌跡、訊息收發、離線地圖，支援 Android、Windows、iOS 與 macOS。"
         data-en="APRSLocus is a cross-platform, multilingual APRS client — live stations and tracks, messaging, and offline maps across Android, Windows, iOS and macOS.">APRSLocus 是一个跨平台、多语言的业余无线电 APRS 客户端：实时台站与轨迹、消息收发、离线地图，支持 Android、Windows、iOS 与 macOS。</p>
    </div>

    <div class="plat">
      <span class="k i18n" data-zh="平台" data-tw="平台" data-en="Platforms">平台</span>
      <span class="v">Android · Windows · iOS · macOS</span>
    </div>

    <div class="foot">
      <img class="qr" id="qr" src="assets/qr.png" alt="aprslocus.theez.top">
      <div class="foot-t">
        <div class="url" id="url">aprslocus.theez.top</div>
        <div class="foothint i18n"
             data-zh="扫码或访问官网 · 欢迎友链交换"
             data-tw="掃碼或訪問官網 · 歡迎友鏈交換"
             data-en="Scan or visit the site · link exchange welcome">扫码或访问官网 · 欢迎友链交换</div>
      </div>
    </div>
  </div>

  <div class="bar">
    <button id="save">保存图片</button>
    <button id="copy" class="ghost">复制图片</button>
    <div class="lang">
      <button data-lang="zh" class="on">中</button>
      <button data-lang="zh-TW">繁</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
  <p class="hint">本站官网名片，可供友链 / 项目主页引用 · 支持导出 PNG</p>

  <div class="toast" id="toast"></div>

<script>
"use strict";

/* ======================================================================
   把名片渲染成 PNG。做法：直接读取页面上每个元素的几何与样式，
   在 canvas 上按 3 倍像素重画一遍。好处是——保存出来的图和你看到的
   完全一致，不用维护两套排版。中文用同样的字体栈，不会变豆腐块。
   ====================================================================== */
var S = 3;                       // 输出倍率，3 倍足够高清
var BRAND = "#3b6ef5";
var BRAND2 = "#0ea5b7";

function roundRect(c, x, y, w, h, r){
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

function rectOf(el, base){
  var r = el.getBoundingClientRect();
  return { x: r.left - base.left, y: r.top - base.top, w: r.width, h: r.height };
}

function fontOf(el){
  var s = getComputedStyle(el);
  var w = parseInt(s.fontWeight, 10);
  if (isNaN(w)) w = 400;
  // canvas 的 font 只认 400/700（normal/bold）；写成 600/750 之类会让整条
  // font 判为非法并静默退回 10px —— 导出图会突然「全部变小」。
  w = (w >= 600) ? 700 : 400;
  return s.fontStyle + " " + w + " " + s.fontSize + " " + s.fontFamily;
}

function txt(el){ return el ? el.textContent.trim() : ""; }

function fillTextEl(c, el, o, base){
  if (!el) return;
  var r = rectOf(el, base);
  var s = getComputedStyle(el);
  c.font = fontOf(el);
  c.fillStyle = o.color || s.color;
  c.textAlign = o.align || "left";
  c.textBaseline = o.baseline || "middle";
  var x;
  if (o.align === "center") x = r.x + r.w / 2;
  else if (o.align === "right") x = r.x + r.w;
  else x = r.x;
  c.fillText(txt(el), x, r.y + r.h / 2 + (o.dy || 0));
}

/* 圆角胶囊：按元素的底色 / 描边色画一个 pill，再居中写文字。 */
function fillPill(c, el, base){
  var r = rectOf(el, base);
  var s = getComputedStyle(el);
  roundRect(c, r.x, r.y, r.w, r.h, r.h / 2);
  c.fillStyle = s.backgroundColor;
  c.fill();
  c.lineWidth = 1;
  c.strokeStyle = s.borderTopColor;
  c.stroke();
  c.font = fontOf(el);
  c.fillStyle = s.color;
  c.textAlign = "center";
  c.textBaseline = "middle";
  c.fillText(txt(el), r.x + r.w / 2, r.y + r.h / 2 + 1);
}

/* 图片：可选圆角裁切，按元素显示尺寸绘制。 */
function drawImg(c, el, base, radius){
  if (!el || !el.complete || !el.naturalWidth) return;
  var r = rectOf(el, base);
  c.save();
  if (radius){ roundRect(c, r.x, r.y, r.w, r.h, radius); c.clip(); }
  c.drawImage(el, r.x, r.y, r.w, r.h);
  c.restore();
}

/* 富文本一行：把元素里的文本节点与 <span>（强调色）当作若干「run」，
   贪心折行后逐段上色绘制。避免整条被当成单色纯文本、或因换行而错位。 */
function fillRich(c, el, base){
  if (!el) return;
  var r = rectOf(el, base);
  var s = getComputedStyle(el);
  var lh = parseFloat(s.lineHeight) || parseFloat(s.fontSize) * 1.4;
  var runs = [];
  el.childNodes.forEach(function(n){
    if (n.nodeType === 1 && n.tagName === "SPAN")
      runs.push({ t: n.textContent, c: getComputedStyle(n).color });
    else if (n.nodeType === 3)
      runs.push({ t: n.textContent, c: s.color });
  });
  c.font = fontOf(el);
  c.textAlign = "left";
  c.textBaseline = "middle";
  var lines = [[]], lineW = 0, maxW = r.w;
  runs.forEach(function(run){
    Array.from(run.t).forEach(function(ch){
      var w = c.measureText(ch).width;
      if (lineW + w > maxW && lineW > 0){ lines.push([]); lineW = 0; }
      var last = lines[lines.length - 1];
      if (last.length && last[last.length - 1].c === run.c) last[last.length - 1].t += ch;
      else last.push({ t: ch, c: run.c });
      lineW += w;
    });
  });
  var y0 = r.y + (r.h - lines.length * lh) / 2 + lh / 2;
  lines.forEach(function(line, i){
    var x = r.x;
    line.forEach(function(seg){
      c.fillStyle = seg.c;
      c.fillText(seg.t, x, y0 + i * lh);
      x += c.measureText(seg.t).width;
    });
  });
}

function wrapLines(c, text, maxW){
  var out = [], cur = "";
  // 按空白 + 逐字（中日韩 / 中文标点）切分：中文没有词间空格，
  // 必须允许在任意汉字间断行。
  var tokens = text.split(/(\s+|[\u4e00-\u9fff\u3000-\u303f，。；：、！？（）])/);
  for (var i = 0; i < tokens.length; i++){
    var t = tokens[i];
    if (t === "") continue;
    var test = cur + t;
    if (c.measureText(test).width > maxW && cur !== ""){
      out.push(cur.replace(/\s+$/, ""));
      cur = /^\s+$/.test(t) ? "" : t;
    } else {
      cur = test;
    }
  }
  if (cur.trim() !== "") out.push(cur.replace(/\s+$/, ""));
  return out;
}

function render(){
  var card = document.getElementById("card");
  var base = card.getBoundingClientRect();
  var W = base.width, H = base.height;

  var cv = document.createElement("canvas");
  cv.width = Math.round(W * S);
  cv.height = Math.round(H * S);
  var c = cv.getContext("2d");
  c.scale(S, S);

  // 卡片底 + 顶条
  roundRect(c, 0, 0, W, H, 22);
  c.fillStyle = "#ffffff";
  c.fill();
  c.save();
  roundRect(c, 0, 0, W, H, 22);
  c.clip();
  var g = c.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, BRAND);
  g.addColorStop(1, BRAND2);
  c.fillStyle = g;
  c.fillRect(0, 0, W, 6);
  c.restore();

  // 分割线（.hr 与页脚顶线）
  card.querySelectorAll(".hr").forEach(function(el){
    var r = rectOf(el, base);
    c.fillStyle = getComputedStyle(el).backgroundColor;
    c.fillRect(r.x, r.y, r.w, Math.max(1, r.h));
  });

  // 品牌 logo + 标题
  drawImg(c, document.getElementById("logo"), base, 13);
  fillTextEl(c, card.querySelector(".app"), {}, base);
  fillTextEl(c, card.querySelector(".sub"), {}, base);

  // 右上角胶囊
  var tag = card.querySelector(".tag");
  if (tag) fillPill(c, tag, base);

  // 主标语（内含 <span> 强调色，交给富文本渲染器折行上色）
  fillRich(c, card.querySelector(".headline"), base);

  // 特性胶囊
  card.querySelectorAll(".chip").forEach(function(chip){ fillPill(c, chip, base); });

  // 正文：按元素宽度自己折行（canvas 不会自动换行）
  var desc = document.getElementById("desc");
  if (desc){
    var dr = rectOf(desc, base);
    var ds = getComputedStyle(desc);
    c.font = fontOf(desc);
    c.fillStyle = ds.color;
    c.textAlign = "left";
    c.textBaseline = "top";
    var dlh = parseFloat(ds.lineHeight) || (parseFloat(ds.fontSize) * 1.85);
    var lines = wrapLines(c, txt(desc), dr.w);
    lines.forEach(function(line, i){
      c.fillText(line, dr.x, dr.y + i * dlh + (dlh - parseFloat(ds.fontSize)) / 2);
    });
  }

  // 平台行
  var plat = card.querySelector(".plat");
  if (plat){
    fillTextEl(c, plat.querySelector(".k"), {}, base);
    fillTextEl(c, plat.querySelector(".v"), {}, base);
  }

  // 页脚：顶线 + 二维码 + 官网 + 提示
  var foot = card.querySelector(".foot");
  if (foot){
    var fs = getComputedStyle(foot);
    var fr = rectOf(foot, base);
    c.fillStyle = fs.borderTopColor;
    c.fillRect(fr.x, fr.y, fr.w, 1);
  }
  drawImg(c, document.getElementById("qr"), base, 8);
  fillTextEl(c, document.getElementById("url"), {}, base);
  fillTextEl(c, card.querySelector(".foothint"), {}, base);

  return cv;
}

/* ---------- 交互 ---------- */
var toastEl = document.getElementById("toast");
var toastT = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.classList.remove("on"); }, 1800);
}

document.getElementById("save").addEventListener("click", function(){
  var cv = render();
  var a = document.createElement("a");
  a.download = "APRSLocus-card.png";
  a.href = cv.toDataURL("image/png");
  a.click();
  toast("已保存 PNG");
});

document.getElementById("copy").addEventListener("click", function(){
  var cv = render();
  if (cv.toBlob && navigator.clipboard && window.ClipboardItem){
    cv.toBlob(function(blob){
      navigator.clipboard.write([new ClipboardItem({ "image/png": blob })])
        .then(function(){ toast("已复制到剪贴板"); })
        .catch(function(){ toast("复制失败，请用「保存图片」"); });
    }, "image/png");
  } else {
    toast("此浏览器不支持复制，请用「保存图片」");
  }
});

/* 语言切换：只换带 data-* 的文案（标题里的 <span> 用 innerHTML 保留强调色） */
document.querySelectorAll(".lang button").forEach(function(btn){
  btn.addEventListener("click", function(){
    var lang = btn.getAttribute("data-lang");
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("on", b === btn);
    });
    var key = lang === "zh-TW" ? "tw" : (lang === "en" ? "en" : "zh");
    document.querySelectorAll("[data-zh]").forEach(function(el){
      var v = el.getAttribute("data-" + key);
      if (v == null) return;
      if (el.querySelector("span")) el.innerHTML = v;
      else el.textContent = v;
    });
  });
});
</script>
</body>
</html>
